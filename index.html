  /* touch-action:manipulation disables the double-tap-to-zoom gesture
     (which otherwise fires on rapid repeated taps of a button, e.g.
     undo or the draw pile) while still allowing normal scrolling;
     .card overrides this to "none" since drag handles all its own
     touch behavior */
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; tap-highlight-color: transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    min-height:calc(var(--app-height, 100dvh));
    background:var(--ink-900);
    color:var(--text-color);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  .display{
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    letter-spacing:0.01em;
  }

  /* horizontal inset lives here (not on .topbar/.surface individually)
     so the title and the play area — two separate max-width:520,
     margin:auto-centered boxes — size against the exact same padded
     width and land on the exact same edges at every viewport size */
  #app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    min-height:calc(var(--app-height, 100dvh));
    padding-left:max(10px, env(safe-area-inset-left));
    padding-right:max(10px, env(safe-area-inset-right));
  }

  /* ---------- top bar: title only. Mirrors to whichever side the
     player's thumb favors, same as the rest of the controls — left-
     handed keeps it flush against the left edge, right-handed flips
     it to the right. ---------- */
  /* Centering the title purely within .topbar's own box would still
     look top-heavy: .play-group starts with an undo-row that reserves
     ~86px (24px margin-top + 40px min-height + 16px margin-bottom) even
     while the undo button itself is invisible (visibility:hidden, not
     display:none, so the layout never jumps when it appears), plus
     .surface's own 6px top padding — 92px of real, structural gap that
     follows immediately after .topbar but isn't part of it. Padding the
     top by that same 92px (on top of the actual visual gap G) makes the
     title's midpoint land at the midpoint of the FULL empty span up
     to where the foundations actually appear, not just within
     .topbar's own shorter box — and it works out regardless of the
     title's own rendered height, which changes with viewport width. */
  .topbar{
    flex:0 0 auto;
    display:flex;
    max-width:520px;
    width:100%;
    margin:0 auto;
    /* no left/right padding here — the horizontal inset is #app's job
       now (see its rule above), shared with .surface, so this and the
       play area size against the exact same padded width */
    padding:calc(env(safe-area-inset-top) + 92px + 28px) 0 28px 0;
  }
  #app.left .topbar{justify-content:flex-start;}
  #app.right .topbar{justify-content:flex-end;}
  .wordmark{
    margin:0;
    font-family:'Jersey 10', 'Iowan Old Style', Georgia, serif;
    font-weight:400;
    font-size:clamp(52px, 20vw, 80px);
    line-height:58px;
    letter-spacing:-0.03em;
    color:var(--heading-color);
    text-align:left;
    cursor:pointer;
    transition:transform .12s ease;
  }
  #app.right .wordmark{text-align:right;}
  .wordmark:active{transform:scale(0.96);}

  /* ---------- main play surface: spread across the viewport so the
     frequently-tapped controls sit in the thumb's natural resting arc
     rather than glued to the very bottom edge ---------- */
  .surface{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    /* left/right come from #app now, not here — see its rule */
    padding:6px 0 calc(18px + env(safe-area-inset-bottom)) 0;
    display:flex;
  }
  .table{
    max-width:520px;
    width:100%;
    margin:0 auto;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
  }
  /* the play group's lead-in space now lives in .topbar's own height
     (title centers within it) rather than a separate spacer here, so
     its top position stays fixed regardless of tableau/undo-button
     content changes below. trail absorbs whatever's left before the
     bottom bar. */
  .spacer{flex:1 1 0%;}
  .spacer-trail{flex-grow:1;}
  .play-group{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .foundations{
    display:flex;
    gap:var(--gap);
    flex:0 0 auto;
  }
  .foundation{
    --border-w:1.5px;
    width:var(--card-w);
    flex:0 0 auto;
    aspect-ratio:5/7;
    border-radius:8px;
    border:var(--border-w) dashed var(--felt-border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .foundation:has(.card){border-style:solid;}
  .foundation .ghost{
    width:clamp(16px,5.2vw,24px);
    height:clamp(16px,5.2vw,24px);
    color:var(--felt-border);
    opacity:0.7;
  }
  /* explicit width (not inset:0) so this always matches every other
     card's size exactly. top/left are pulled in by the border width
     because an absolutely positioned child's containing block is the
     padding box, not the border box — without this offset the card
     sits inset from its own foundation's top-left border, leaving a
     sliver of dashed outline visible even once the slot is filled */
  .foundation .card{position:absolute; top:calc(-1 * var(--border-w)); left:calc(-1 * var(--border-w)); width:var(--card-w); margin:0;}

  .tableau{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:var(--gap);
  }
  .col{
    display:flex;
    flex-direction:column;
    min-height:24px;
  }

  .card{
    aspect-ratio:5/7;
    border-radius:8px;
    border:1px solid transparent;
    display:flex;
    flex-direction:column;
    gap:14%;
    padding:4% 8%;
    position:relative;
    cursor:pointer;
    touch-action:none;
    transition:transform .12s ease;
  }
  .card.up{
    background:var(--paper-100);
    border-color:var(--paper-border);
  }
  .card.down{
    background:var(--felt-700);
    border-color:var(--felt-border);
  }
  .card.red{color:var(--brick-600);}
  .card.black{color:var(--charcoal-900);}
  .card .rank{
    min-height:26%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-size:clamp(10px, calc(var(--card-w) * 0.333), 20px);
    font-weight:700;
    line-height:1;
  }
  .rank-ten{letter-spacing:-0.08em;}
  .card .suit-mini{font-size:0.75em;}
  .card .pip{
    align-self:center;
    font-size:clamp(18px, calc(var(--card-w) * 0.667), 42px);
    line-height:1;
  }
  .suit-icon{width:1em; height:1em; display:inline-block; vertical-align:-0.14em;}
  .ui-icon{width:1em; height:1em; display:block;}
  .card.bounce{animation:bounce .32s ease;}
  @keyframes bounce{
    0%{transform:translateY(0);}
    35%{transform:translateY(-10px);}
    65%{transform:translateY(2px);}
    100%{transform:translateY(0);}
  }
  .card.flip-reveal{animation:flip-reveal .28s ease;}
  /* --fan-x carries the waste fan's translateX offset (0 for any card
     that isn't part of the fan) through the keyframes, so revealing a
     fanned card spins it in place instead of the rotation briefly
     clobbering its fan position and snapping over once it ends */
  @keyframes flip-reveal{
    0%{transform:translate(var(--fan-x, 0), 0) rotateY(90deg); filter:brightness(0.7);}
    100%{transform:translate(var(--fan-x, 0), 0) rotateY(0deg); filter:brightness(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
    .card.bounce{animation:none;}
    .card.flip-reveal{animation:none;}
    .draw-btn, .undo-btn, .autocomplete-btn{transition:none;}
  }

  .empty-drop{
    border:1.5px dashed var(--felt-border);
    border-radius:7px;
    aspect-ratio:5/7;
  }
  .col.drop-target, .foundation.drop-target{
    outline:3px solid var(--brass-400);
    outline-offset:-3px;
    border-radius:7px;
  }

  /* ---------- undo row + controls row: sit just above the tableau,
     mirrored by hand mode so the frequently-tapped stock/waste side
     lands in the thumb's natural resting arc ---------- */
  .undo-row{
    flex:0 0 auto;
    display:flex;
    gap:12px;
    margin-top:24px;
    margin-bottom:16px;
  }
  /* row-reverse (not just justify-content) so the draw button — first
     in source order — stays the one closest to the thumb edge in both
     hand modes, same trick the bottom bar uses to keep New Game
     pinned to the edge */
  #app.right .undo-row{justify-content:flex-start; flex-direction:row-reverse;}
  #app.left .undo-row{justify-content:flex-start; flex-direction:row;}

  /* draw button sits directly above the stock/waste pile and shares
     its exact column width so the invisible .draw-bridge between them
     reads as one continuous tap target. It's the filled/primary action
     until Auto Complete becomes available, at which point Auto
     Complete takes over as the filled one and Draw steps back to an
     outline — only one accent-filled button on screen at a time. */
  .draw-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:calc(var(--card-w) * 2 + 6px);
    min-height:40px;
    border:1px solid var(--heading-color);
    border-radius:8px;
    background:var(--heading-color);
    color:var(--on-heading);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .draw-btn:active{filter:brightness(1.12);}
  .draw-btn.outline{
    border-color:var(--felt-border);
    background:transparent;
    color:var(--text-color);
  }
  .draw-btn.outline:active{filter:none; background:var(--felt-700);}
  .draw-btn:disabled{opacity:0.4; cursor:default; filter:none;}

  /* invisible bridge filling the gap between the draw button and the
     stock/waste pile below it, so the whole column between them is
     tappable instead of just the two card-sized targets */
  .draw-bridge{
    position:absolute;
    top:64px;
    height:16px;
    width:calc(var(--card-w) * 2 + 6px);
    cursor:pointer;
  }
  #app.left .draw-bridge{left:0;}
  #app.right .draw-bridge{right:0;}

  .autocomplete-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    width:40px;
    min-height:40px;
    border:1px solid var(--heading-color);
    border-radius:8px;
    background:var(--heading-color);
    color:var(--on-heading);
    cursor:pointer;
    opacity:1;
    transform:scale(1);
    transition:width .22s ease, border-width .22s ease, opacity .18s ease, transform .18s ease;
  }
  .autocomplete-btn .ui-icon{width:16px; height:16px;}
  .autocomplete-btn:active{filter:brightness(1.12);}
  /* collapses to zero width (rather than display:none) so the row
     smoothly slides Draw/Undo over instead of popping them into place */
  .autocomplete-btn.is-hidden{
    width:0;
    min-width:0;
    border-width:0;
    opacity:0;
    transform:scale(0.85);
  }

  .undo-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    min-height:40px;
    border:1px solid var(--felt-border);
    border-radius:8px;
    background:transparent;
    color:var(--text-color);
    cursor:pointer;
    opacity:1;
    transform:scale(1);
    transition:opacity .18s ease, transform .18s ease, visibility 0s linear 0s;
  }
  .undo-btn .ui-icon{width:16px; height:16px;}
  .undo-btn:active{background:var(--felt-700);}
  /* stays visibility:hidden (not display:none) so the row's height
     never jumps — only fades/shrinks in place. The visibility flip is
     delayed on the way out so it stays hit-testable through the fade,
     but takes effect immediately on the way back in. */
  .undo-btn.is-hidden{
    opacity:0;
    transform:scale(0.85);
    visibility:hidden;
    transition:opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
  }

  .controls-row{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  #app.left .controls-row{flex-direction:row;}
  #app.right .controls-row{flex-direction:row-reverse;}
  .stock-waste{flex:0 0 auto; display:flex; gap:6px;}
  #app.left .stock-waste{flex-direction:row;}
  #app.right .stock-waste{flex-direction:row-reverse;}

  .dock-slot{
    flex:0 0 auto;
    width:var(--card-w);
    aspect-ratio:5/7;
  }
  .waste-slot{position:relative;}
  .waste-slot .card{position:absolute; top:0; left:0; width:var(--card-w); margin:0;}
  .waste-slot .empty-drop{width:100%; height:100%;}

  .stock-btn{
    flex:0 0 auto;
    width:var(--card-w);
    aspect-ratio:5/7;
    border-radius:8px;
    border:1px solid var(--felt-border);
    background:var(--felt-700);
    color:var(--text-color);
    position:relative;
    cursor:pointer;
    padding:0;
  }
  .stock-btn:active{filter:brightness(1.12);}
  .stock-btn:disabled{opacity:0.4; filter:none;}
  .stock-btn .ui-icon{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:38%; height:38%;
  }
  .stock-btn.empty{background:transparent; border-style:dashed;}

  /* ---------- bottom bar: New Game, draw-count, hand-mode, and (web
     only) the App Store badge. The badge lives in this same row —
     space-between — rather than being fixed to the viewport, so its
     edge tracks the play area's own edge (which is centered/padded
     independently of the raw screen) instead of the screen's edge. ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:4px;
  }
  #app.left .bottom-bar{flex-direction:row;}
  #app.right .bottom-bar{flex-direction:row-reverse;}
  /* the 3 buttons stay grouped as their own unit; reversing their
     order too when flipped keeps New Game closest to the thumb edge */
  .bottom-buttons{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  #app.left .bottom-buttons{flex-direction:row;}
  #app.right .bottom-buttons{flex-direction:row-reverse;}
  .newgame-btn, .draw-toggle, .hand-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:40px;
    padding:0 16px;
    border:1px solid var(--felt-border);
    border-radius:8px;
    background:transparent;
    color:var(--text-color);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .newgame-btn:active, .draw-toggle:active, .hand-toggle:active{background:var(--felt-700);}
  .newgame-btn .ui-icon{width:16px; height:16px;}
  .draw-toggle{width:40px; padding:0;}
  .hand-toggle{width:40px; padding:0;}
  .hand-toggle .ui-icon{width:18px; height:18px; transition:transform .18s ease;}
  #app.left .hand-toggle .ui-icon{transform:scaleX(-1);}

  canvas#confetti{position:fixed; inset:0; z-index:19; pointer-events:none;}

  /* ---------- App Store badge: web only, sits in the bottom bar's
     own row (opposite the hand-mode buttons via justify-content:
     space-between above) so it aligns with the play area's edge,
     not the raw screen edge ---------- */
  .app-store-badge{
    line-height:0;
  }
  /* the [hidden] attribute is how JS keeps this out of the native app;
     display:block has to be scoped to :not([hidden]) rather than set
     unconditionally, since an unconditional author-stylesheet display
     value always beats the browser's built-in [hidden]{display:none} */
  .app-store-badge:not([hidden]){display:block;}
  .app-store-badge svg{display:block; width:135px; height:40px;}
</style>
</head>

    s = Math.max(0, Math.min(100, s));

  function between(min,max){ return min + Math.random()*(max-min); }

  // ---------- WCAG 2.1 contrast verification ----------
  // Every generated palette gets checked against real contrast math
  // (not just eyeballed lightness gaps) and repaired if it falls
  // short, so "looks about right" can't slip through as "fails for

  function hslToRgb(h,s,l){

  // (plus a small safety margin — hsl() rounds lightness to a whole
  // number when stringified for CSS, which can shave a few hundredths

    var safeTarget = target + 0.15;
    function pushed(dir){
      var f = {h:fg.h, s:fg.s, l:fg.l};
      var iter = 0;
      while (contrastOf(f,bg) < safeTarget && iter < 200){
        var hasRoom = dir>0 ? f.l<100 : f.l>0;
        if (!hasRoom) break;
        f.l = Math.max(0, Math.min(100, f.l + dir*0.6));
        iter++;
      }
      return f;
    }
    var lighter = pushed(1), darker = pushed(-1);
    fg.l = contrastOf(lighter,bg) >= contrastOf(darker,bg) ? lighter.l : darker.l;
    return fg;
  }

  // ---------- time-of-day themes ----------
  // Reads the player's own device clock (their local time, not a
  // server's) and picks a mood matching that part of the day (morning
  // and daytime read bright, dusk and night read dark).
  function getTimeOfDay(){
    var h = new Date().getHours();
    if (h >= 5 && h < 11) return "morning";
    if (h >= 11 && h < 17) return "daytime";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }

  // Every entry below is a real, currently-trending palette copied

  // published there) — not an invented/procedural color scheme. Each
  // mood bucket holds several real palettes fitting that time of day's
  // character; one is picked at random on every load, so the exact
  // colors vary but always trace back to an actual coolors palette.
  var MOOD_DARK = { morning:false, daytime:false, dusk:true, night:true };

  var PALETTES = {

  function hexToHsl(hex){
    var r = parseInt(hex.substr(0,2),16)/255;
    var g = parseInt(hex.substr(2,2),16)/255;
    var b = parseInt(hex.substr(4,2),16)/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b);
    var h, s, l = (max+min)/2;
    if (max === min){ h = s = 0; }
    else {
      var d = max-min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      if (max === r) h = (g-b)/d + (g<b ? 6 : 0);
      else if (max === g) h = (b-r)/d + 2;
      else h = (r-g)/d + 4;
      h /= 6;
    }
    return {h:h*360, s:s*100, l:l*100};
  }

  // Distance-from-orange (hue 20) used to sort a real palette's two
  // leftover colors into "warm suit" vs "cool suit" without inventing
  // any new hue — both colors still come straight from the palette.
  function warmScore(h){
    var d = Math.min(Math.abs(h-20), 360-Math.abs(h-20));
    return -d;
  }
  function hueDist(a,b){
    var d = Math.abs(a-b) % 360;
    return d > 180 ? 360-d : d;
  }

  // Two different real palettes can still "feel" like the same theme
  // if their backgrounds land in the same hue family (e.g. two blues)
  // — the actual reported symptom here. Track the previous pick's
  // background hue and, given a choice, avoid landing near it again;
  // also never repeat the exact same palette back-to-back.
  var lastPaletteName = null;
  var lastBgHue = null;
  function paletteBgHue(pal, darkMode){
    var sorted = pal.hex.map(hexToHsl).sort(function(a,b){ return a.l - b.l; });
    return (darkMode ? sorted[0] : sorted[4]).h;
  }

  function randomPalette(){
    var mood = getTimeOfDay();
    var group = PALETTES[mood];
    var darkMode = MOOD_DARK[mood];
    var dir = darkMode ? 1 : -1;

    var candidates = group.filter(function(p){ return p.name !== lastPaletteName; });
    if (lastBgHue !== null){
      var distinct = candidates.filter(function(p){
        return hueDist(paletteBgHue(p, darkMode), lastBgHue) > 40;
      });
      if (distinct.length) candidates = distinct;
    }
    var chosen = candidates[Math.floor(Math.random()*candidates.length)];
    lastPaletteName = chosen.name;

    var sorted = chosen.hex.map(hexToHsl).sort(function(a,b){ return a.l - b.l; });
    lastBgHue = (darkMode ? sorted[0] : sorted[4]).h;
    // background takes whichever end of the real palette is
    // appropriately dark/light for this time of day; the card face
    // ("paper") always wants to read light regardless of mode, so it
    // takes the palette's lightest color (or next-lightest if that
    // one was already spent on the background)
    var bgC = darkMode ? sorted[0] : sorted[4];
    var paperC = darkMode ? sorted[4] : sorted[3];
    var remaining = sorted.filter(function(c){ return c !== bgC && c !== paperC; });
    // suit colors need to read as visibly different hues (red-ish vs
    // black-ish suits) more than they need to be the most saturated
    // leftovers, so pick whichever pair of the 3 remaining colors is
    // furthest apart in hue for the suits, leaving the third for brass
    var pairs = [[0,1],[0,2],[1,2]];
    var bestPair = pairs[0], bestDist = -1;
    pairs.forEach(function(p){
      var d = hueDist(remaining[p[0]].h, remaining[p[1]].h);
      if (d > bestDist){ bestDist = d; bestPair = p; }
    });
    var brassIdx = 3 - bestPair[0] - bestPair[1];
    var brassC = remaining[brassIdx];
    var rest = [remaining[bestPair[0]], remaining[bestPair[1]]];
    var suitWarmC, suitCoolC;
    if (warmScore(rest[0].h) >= warmScore(rest[1].h)){ suitWarmC = rest[0]; suitCoolC = rest[1]; }
    else { suitWarmC = rest[1]; suitCoolC = rest[0]; }

    var ink900 = {h:bgC.h, s:bgC.s, l:bgC.l};
    // paper (the face-up card itself) is a fixed white/light-gray pair
    // rather than palette-derived — playing-card faces read as a
    // physical, neutral surface regardless of the felt around them,
    // not another themed color. paperC is still carved out of the
    // palette above so brass/suit color selection is unaffected.
    var paper = {h:0, s:0, l:100};
    var brass = {h:brassC.h, s:Math.max(brassC.s,40), l:Math.min(Math.max(brassC.l,40),68)};
    var brass400 = {h:brass.h, s:Math.max(0,brass.s-6), l:Math.min(96,brass.l+14)};
    var feltHue = ink900.h + 15;
    var fillL = ink900.l + dir*between(12,20);
    var felt700 = {h:feltHue, s:Math.max(20,Math.min(40,ink900.s)), l:fillL};
    var text = {h:ink900.h, s:Math.max(0,ink900.s-10), l: darkMode ? between(90,98) : between(8,20)};
    // heading-color is its own token (not reused for suit text) since
    // it only ever has to contrast against the page background, while
    // the suit colors below have the separate, sometimes-conflicting
    // job of contrasting against the always-light card paper
    var heading = {h:brass.h, s:Math.max(brass.s,50), l: darkMode ? between(62,74) : between(28,40)};
    var onBrass = {h:ink900.h, s:Math.min(100,ink900.s+10), l: brass.l >= 50 ? 12 : 92};
    // Suit colors aren't locked to a traditional bright/dark (red vs
    // black) split — both share the same lightness band here, so
    // which real palette color ends up more or less vivid is whatever
    // the palette actually gave us, not a rule that always makes one
    // suit "the pale one" and the other "the near-black one." Paper
    // is fixed white now (see above), so ensureContrast below will
    // still darken either one as needed for real legibility — this
    // clamp just keeps the *starting* point sane.
    var suitWarm = {h:suitWarmC.h, s:Math.max(suitWarmC.s,40), l:Math.min(Math.max(suitWarmC.l,15),65)};
    var suitCool = {h:suitCoolC.h, s:Math.max(suitCoolC.s,40), l:Math.min(Math.max(suitCoolC.l,15),65)};
    // some real palettes are near-monochrome (e.g. all blues), which
    // would otherwise leave the two suit colors too close in hue to
    // tell apart at a glance — push suitCool further around the
    // wheel, away from suitWarm, until they clear a floor
    var MIN_SUIT_HUE_SEP = 70;
    var suitSep = ((suitCool.h - suitWarm.h + 540) % 360) - 180;
    if (Math.abs(suitSep) < MIN_SUIT_HUE_SEP){
      var suitSign = suitSep >= 0 ? 1 : -1;
      suitCool.h = suitCool.h + suitSign*(MIN_SUIT_HUE_SEP - Math.abs(suitSep));
    }

    // felt-border/paper-border are shades of felt-700/paper-100 (same
    // hue+sat, lightness pushed further along the same staircase
    // direction) so every dashed outline and card-back border reads
    // as "a shade of its own surface," never an unrelated accent color
    var feltBorder = {h:feltHue, s:felt700.s, l:felt700.l + dir*between(10,16)};

    // ---- accessibility repairs (WCAG 2.1 AA) ----
    ensureContrast(text, ink900, 4.5);     // page text/icons vs page bg
    ensureContrast(text, felt700, 4.5);    // button text/icons vs their fill
    ensureContrast(heading, ink900, 4.5);  // title vs page bg
    ensureContrast(onBrass, brass, 4.5);   // win-dialog button text vs its fill
    ensureContrast(suitWarm, paper, 4.5);  // red-suit rank/icon vs card face
    ensureContrast(suitCool, paper, 4.5);  // black-suit rank/icon vs card face

    // buttons filled with the heading color need real black-or-white
    // text rather than a hue-tinted one — heading can land anywhere
    // from dark to light depending on the palette roll, and only a
    // flat white/black choice, picked by whichever actually contrasts
    // better, holds up across all of them. Computed after heading's
    // own contrast repair above so it's judged on the final color.
    var onHeading = contrastOf({h:0,s:0,l:100}, heading) >= contrastOf({h:0,s:0,l:0}, heading)
      ? "#ffffff" : "#000000";
    // card/button outlines are decorative — the shapes they trace are
    // already distinguishable by their fill color, so these target a
    // soft, low-contrast line rather than the 3:1 UI-boundary minimum
    ensureContrast(feltBorder, felt700, 1.35); // card-back/button border vs its fill
    ensureContrast(feltBorder, ink900, 1.35);  // same border where it shows on bare page bg
    ensureContrast(brass400, ink900, 3.0);     // drag drop-target outline vs page bg — stays bold, it's a functional affordance

    return {
      "--ink-900": hsl(ink900.h, ink900.s, ink900.l),
      "--felt-700": hsl(felt700.h, felt700.s, felt700.l),
      "--felt-600": hsl(feltHue, felt700.s, fillL + dir*between(4,8)),
      "--felt-border": hsl(feltBorder.h, feltBorder.s, feltBorder.l),
      "--text-color": hsl(text.h, text.s, text.l),
      "--heading-color": hsl(heading.h, heading.s, heading.l),
      "--paper-100": "#ffffff",
      "--paper-border": "#e0e0e0",
      "--brass-500": hsl(brass.h, brass.s, brass.l),
      "--brass-400": hsl(brass400.h, brass400.s, brass400.l),
      "--on-brass": hsl(onBrass.h, onBrass.s, onBrass.l),
      "--brick-600": hsl(suitWarm.h, suitWarm.s, suitWarm.l),
      "--charcoal-900": hsl(suitCool.h, suitCool.s, suitCool.l),
      "--on-heading": onHeading
    };
  }

  function applyPalette(vars){
    var root = document.documentElement.style;
    Object.keys(vars).forEach(function(k){ root.setProperty(k, vars[k]); });
  }

  function freshDeck(){
    var deck = [];
    for (var s=0; s<SUITS.length; s++){
      for (var r=1; r<=13; r++){
        deck.push({suit:SUITS[s], rank:r, faceUp:false});
      }
    }
    for (var i=deck.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = deck[i]; deck[i]=deck[j]; deck[j]=t;
    }
    return deck;
  }

  function newGame(){
    var deck = freshDeck();
    var tableau = [[],[],[],[],[],[],[]];
    for (var c=0; c<7; c++){
      for (var k=0; k<=c; k++){
        var card = deck.pop();
        card.faceUp = (k===c);
        tableau[c].push(card);
      }
    }
    state = {
      tableau: tableau,
      stock: deck,
      waste: [],
      foundations: {S:[],H:[],D:[],C:[]}
    };
    history = [];
    selection = null;
    moveCount = 0;
    won = false;
    renderBoard(); // skip the move/reveal transition for a full reshuffle
  }

  function snapshot(){
    return JSON.parse(JSON.stringify(state));
  }
  function pushHistory(){
    history.push(snapshot());
    if (history.length>200) history.shift();
  }
  function undo(){
    if (!history.length) return;
    state = history.pop();
    selection = null;
    if (moveCount>0) moveCount--;
    render();
  }

  function topCard(col){
    var pile = state.tableau[col];
    return pile.length ? pile[pile.length-1] : null;
  }

  function canStackTableau(card, destCol){
    var pile = state.tableau[destCol];
    if (!pile.length) return card.rank === 13;
    var top = pile[pile.length-1];
    if (!top.faceUp) return false;
    var altColor = SUIT_COLOR[card.suit] !== SUIT_COLOR[top.suit];
    return altColor && card.rank === top.rank - 1;
  }

  function canStackFoundation(card, suit){
    var pile = state.foundations[suit];
    if (card.suit !== suit) return false;
    if (!pile.length) return card.rank === 1;
    return card.rank === pile[pile.length-1].rank + 1;
  }

  // True once there's nothing left to actually decide: every tableau
  // card is face-up (draw-1), or face-up with the stock pile also
  // spent (draw-3, where undrawn stock cards are still "hidden" in a
  // real sense since the player never saw them come up 3 at a time).
  // Whenever this holds, repeatedly sending any available top card to
  // its foundation — drawing the rest of the stock along the way —
  // is guaranteed to finish the game: a card can only ever be stuck
  // waiting on a lower card of its own suit, and that lower card is
  // always face-up somewhere too, so the wait always resolves.
  function canAutocomplete(){
    var total = 0;
    SUITS.forEach(function(s){ total += state.foundations[s].length; });
    if (total === 52) return false;
    if (drawCount === 3 && state.stock.length > 0) return false;
    return state.tableau.every(function(pile){
      return pile.every(function(c){ return c.faceUp; });
    });
  }

  function flipExposed(col){
    var pile = state.tableau[col];
    if (pile.length){
      var top = pile[pile.length-1];
      if (!top.faceUp) top.faceUp = true;
    }
  }

  function getSelectedCards(){
    if (!selection) return [];
    if (selection.pile==="waste") return [state.waste[state.waste.length-1]];
    if (selection.pile==="foundation") return [state.foundations[selection.col][state.foundations[selection.col].length-1]];
    return state.tableau[selection.col].slice(selection.idx);
  }

  function removeSelectedFromSource(){
    if (selection.pile==="waste"){
      return [state.waste.pop()];
    }
    if (selection.pile==="foundation"){
      return [state.foundations[selection.col].pop()];
    }
    var pile = state.tableau[selection.col];
    var cards = pile.splice(selection.idx);
    flipExposed(selection.col);
    return cards;
  }

  function moveSelectionToTableau(destCol){
    var cards = getSelectedCards();
    if (!cards.length) return false;
    if (!canStackTableau(cards[0], destCol)) return false;
    if (selection.pile==="tableau" && selection.col===destCol) return false;
    pushHistory();
    var moved = removeSelectedFromSource();
    for (var i=0;i<moved.length;i++) state.tableau[destCol].push(moved[i]);
    moveCount++;
    selection = null;
    render();
    hapticImpact("LIGHT");
    return true;
  }

  function moveSelectionToFoundation(suit){
    var cards = getSelectedCards();
    if (cards.length !== 1) return false;
    if (!canStackFoundation(cards[0], suit)) return false;
    pushHistory();
    var moved = removeSelectedFromSource();
    state.foundations[suit].push(moved[0]);
    moveCount++;
    selection = null;
    render();
    // skip the buzz during Auto Complete's rapid cascade — one light
    // tap per card there would just be noise, not feedback
    if (!autocompleting) hapticImpact("LIGHT");
    checkWin();
    return true;
  }

  // Finds one legal foundation move among the cards actually available
  // right now (waste top, each tableau top) and performs it through
  // the normal selection+move path, so it gets the same history entry,
  // FLIP animation, and win check as a manual move would.
  function tryAutoMove(){
    if (state.waste.length){
      var w = state.waste[state.waste.length-1];
      if (canStackFoundation(w, w.suit)){
        selection = {pile:"waste", col:-1, idx:state.waste.length-1};
        return moveSelectionToFoundation(w.suit);
      }
    }
    for (var c=0; c<7; c++){
      var pile = state.tableau[c];
      if (!pile.length) continue;
      var top = pile[pile.length-1];
      if (canStackFoundation(top, top.suit)){
        selection = {pile:"tableau", col:c, idx:pile.length-1};
        return moveSelectionToFoundation(top.suit);
      }
    }
    return false;
  }

  function runAutocomplete(){
    if (autocompleting) return;
    autocompleting = true;
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Shorten the FLIP move duration for the run and pace steps just
    // past it, so each card fully settles into the foundation before
    // the next step's re-render captures its position — otherwise the
    // still-sliding card gets a fresh partial transform mid-flight
    // every step, which reads as jitter rather than a clean slide.
    var pace = reduceMotion ? 0 : 130;
    if (!reduceMotion) cardMoveMs = 100;
    function finishPace(){ cardMoveMs = 220; }
    // Recycling waste back into the stock redraws it in the exact same
    // order every time (see drawCard), so a lap that sends nothing to
    // a foundation proves another identical lap would too — the only
    // thing that can make a previously-skipped waste card newly
    // reachable is foundation progress made *somewhere* (waste or
    // tableau) since the last time this exact card was up. Track the
    // foundation count as of the last recycle; if a full lap changed
    // nothing, further cycling is provably futile. -1 is a sentinel
    // so the very first recycle always happens — those buried cards
    // haven't been individually re-examined by this algorithm yet,
    // only skipped over during the player's own earlier manual draws.
    var lastFoundationTotal = -1;
    function foundationTotal(){
      var t = 0;
      SUITS.forEach(function(s){ t += state.foundations[s].length; });
      return t;
    }
    function step(){
      if (tryAutoMove()){
        setTimeout(step, pace);
        return;
      }
      if (state.stock.length){
        drawCard();
        setTimeout(step, pace);
        return;
      }
      if (state.waste.length){
        var total = foundationTotal();
        if (total === lastFoundationTotal){
          autocompleting = false;
          finishPace();
          renderBoard();
          return;
        }
        lastFoundationTotal = total;
        drawCard(); // stock is empty, so this recycles waste -> stock
        setTimeout(step, pace);
        return;
      }
      autocompleting = false;
      finishPace();
      renderBoard();
    }
    step();
  }

  function bounceEl(el){
    if (!el) return;
    el.classList.remove("bounce");
    void el.offsetWidth;
    el.classList.add("bounce");
  }

  // Tap a card: if it has any legal move, play it automatically
  // (foundation preferred, else the first open tableau column).
  // If it has none, bounce it in place. Precise placement is done by
  // dragging instead — see the pointer-drag machinery below.
  function findAutoDestination(cards, excludeCol){
    if (cards.length === 1 && canStackFoundation(cards[0], cards[0].suit)){
      return {type:"foundation", suit:cards[0].suit};
    }
    for (var c=0; c<7; c++){
      if (c === excludeCol) continue;
      if (canStackTableau(cards[0], c)) return {type:"tableau", col:c};
    }
    return null;
  }

  function performTapMove(pile, col, idx, el){
    var cards;
    if (pile === "tableau"){
      var card = state.tableau[col][idx];
      if (!card.faceUp) return; // face-down cards aren't playable — no bounce, just ignore the tap
      cards = state.tableau[col].slice(idx);
    } else if (pile === "foundation"){
      if (!state.foundations[col].length) return;
      cards = [state.foundations[col][state.foundations[col].length-1]];
    } else {
      if (!state.waste.length) return;
      cards = [state.waste[state.waste.length-1]];
    }
    var dest = findAutoDestination(cards, pile==="tableau" ? col : -1);
    if (!dest){ bounceEl(el); return; }
    selection = pile==="tableau" ? {pile:"tableau", col:col, idx:idx}
      : pile==="foundation" ? {pile:"foundation", col:col, idx:-1}
      : {pile:"waste", col:-1, idx:state.waste.length-1};
    if (dest.type === "foundation") moveSelectionToFoundation(dest.suit);
    else moveSelectionToTableau(dest.col);
  }

  // ---------- drag-and-drop: lets the player choose an exact
  // destination instead of the automatic one. A pointerdown starts
  // tracking; if the pointer moves past a small threshold before
  // release, it becomes a real drag (cards follow the pointer via
  // fixed-position + translate on the live DOM nodes — render()
  // naturally discards those inline styles on the next redraw, so no
  // separate ghost/cleanup bookkeeping is needed). Release with no
  // meaningful movement is treated as a tap instead. ----------
  var drag = null;

  function onCardPointerDown(pile, col, idx){
    return function(ev){
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      var faceUp = pile !== "tableau" || !!(state.tableau[col][idx] && state.tableau[col][idx].faceUp);
      var cards = null;
      if (faceUp){
        if (pile === "tableau") cards = state.tableau[col].slice(idx);
        else if (pile === "foundation") cards = state.foundations[col].length ? [state.foundations[col][state.foundations[col].length-1]] : null;
        else cards = [state.waste[state.waste.length-1]];
      }
      drag = {
        pile: pile, col: col, idx: idx,
        cards: cards,
        startX: ev.clientX, startY: ev.clientY,
        active: false,
        dragEls: null,
        sourceEl: ev.currentTarget
      };
      try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch(e){}
      ev.preventDefault();
      window.addEventListener("pointermove", onDragMove);
      window.addEventListener("pointerup", onDragEnd);
      window.addEventListener("pointercancel", onDragCancel);
    };
  }

  function activateDrag(){
    drag.active = true;
    var els;
    if (drag.pile === "waste"){
      els = [wasteSlot.querySelector(".card:last-child")];
    } else if (drag.pile === "foundation"){
      var slot = foundationsEl.querySelector('[data-suit="'+drag.col+'"]');
      els = [slot.querySelector(".card")];
    } else {
      var colEl = tableauEl.children[drag.col];
      els = Array.prototype.slice.call(colEl.querySelectorAll(".card"), drag.idx);
    }
    drag.dragEls = els;
    els.forEach(function(el, i){
      // A card grabbed moments after it moved or got revealed can
      // still be mid-animation (a CSS transition easing its FLIP
      // transform back to rest, or the flip-reveal keyframe rotating
      // it through rotateY(90deg)) — measuring its rect in that state
      // gives a squashed or zero-width box. Snap it to its true
      // resting layout first. The only card this ever runs on that
      // has a real non-empty resting transform is the top waste card,
      // whose fan offset at depth 0 is a translate(0,0) no-op, so
      // clearing it is always safe.
      el.style.transition = "none";
      el.style.transform = "";
      el.classList.remove("flip-reveal", "bounce");
      var r = el.getBoundingClientRect();
      el.style.position = "fixed";
      el.style.margin = "0";
      el.style.left = r.left+"px";
      el.style.top = r.top+"px";
      el.style.width = r.width+"px";
      el.style.height = r.height+"px";
      // .card's padding/gap are percentages, which CSS always resolves
      // against the containing block's WIDTH — fine while the card is
      // a normal in-flow tableau/waste/foundation child, but position:
      // fixed changes its containing block to the viewport, so those
      // percentages would suddenly resolve against a width many times
      // larger and balloon the card's visible padding/spacing. Pin them
      // to fixed pixel values computed from the card's real (pre-drag)
      // width so they stay put.
      el.style.padding = (r.width*0.04).toFixed(2)+"px "+(r.width*0.08).toFixed(2)+"px";
      el.style.gap = (r.width*0.14).toFixed(2)+"px";
      el.style.zIndex = 500+i;
      el.style.pointerEvents = "none";
      el.classList.add("dragging");
      // same containing-block issue for .rank's percentage min-height
      // (height percentages resolve against the containing block's
      // height, i.e. the viewport once fixed) — pin it in pixels too
      var rankEl = el.querySelector(".rank");
      if (rankEl) rankEl.style.minHeight = (r.height*0.26).toFixed(2)+"px";
    });
  }

  function positionDragEls(x, y){
    var dx = x-drag.startX, dy = y-drag.startY;
    drag.dragEls.forEach(function(el){
      el.style.transform = "translate("+dx+"px,"+dy+"px) scale(1.03)";
    });
  }

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    var foundationEl = el.closest(".foundation");
    if (foundationEl) return {type:"foundation", suit:foundationEl.dataset.suit, el:foundationEl};
    var colEl = el.closest(".col");
    if (colEl) return {type:"tableau", col:Number(colEl.dataset.col), el:colEl};
    return null;
  }

  function clearDropHighlight(){
    var els = document.querySelectorAll(".drop-target");
    for (var i=0;i<els.length;i++) els[i].classList.remove("drop-target");
  }

  function updateDropHighlight(x, y){
    clearDropHighlight();
    if (!drag.cards) return;
    var target = findDropTarget(x, y);
    if (!target) return;
    var legal = target.type === "foundation"
      ? (drag.cards.length===1 && canStackFoundation(drag.cards[0], target.suit))
      : (canStackTableau(drag.cards[0], target.col) && !(drag.pile==="tableau" && drag.col===target.col));
    if (legal) target.el.classList.add("drop-target");
  }

  // A deliberately generous slop radius — tapping should be the easy,
  // default action and dragging a more deliberate one, so a card isn't
  // accidentally yanked into drag mode by the small amount of finger
  // wobble a normal tap has on a touchscreen.
  var DRAG_THRESHOLD = 18;

  function onDragMove(ev){
    if (!drag) return;
    var dx = ev.clientX-drag.startX, dy = ev.clientY-drag.startY;
    if (!drag.active){
      if (drag.cards && Math.hypot(dx,dy) > DRAG_THRESHOLD) activateDrag();
      else return;
    }
    positionDragEls(ev.clientX, ev.clientY);
    updateDropHighlight(ev.clientX, ev.clientY);
  }

  function endPointerTracking(){
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", onDragEnd);
    window.removeEventListener("pointercancel", onDragCancel);
  }

  function onDragEnd(ev){
    endPointerTracking();
    if (!drag) return;
    var d = drag;
    drag = null;
    clearDropHighlight();
    if (d.active){
      var target = findDropTarget(ev.clientX, ev.clientY);
      var moved = false;
      if (target){
        selection = d.pile==="tableau" ? {pile:"tableau", col:d.col, idx:d.idx}
          : d.pile==="foundation" ? {pile:"foundation", col:d.col, idx:-1}
          : {pile:"waste", col:-1, idx:state.waste.length-1};
        moved = target.type === "foundation" ? moveSelectionToFoundation(target.suit) : moveSelectionToTableau(target.col);
      }
      if (!moved){
        render();
        var el = d.pile==="tableau"
          ? (tableauEl.children[d.col] && tableauEl.children[d.col].children[d.idx])
          : d.pile==="foundation"
            ? (foundationsEl.querySelector('[data-suit="'+d.col+'"] .card'))
            : wasteSlot.querySelector(".card:last-child");
        bounceEl(el);
      }
    } else {
      performTapMove(d.pile, d.col, d.idx, d.sourceEl);
    }
  }

  function onDragCancel(){
    endPointerTracking();
    if (drag && drag.active) render();
    drag = null;
    clearDropHighlight();
  }

  function drawCard(){
    pushHistory();
    // a card moving stock->waste has no on-screen "before" element (the
    // stock pile doesn't render individual cards), so the generic FLIP
    // system in render() can't detect it and animate it — give every
    // newly-revealed card its own flip-reveal explicitly instead.
    var revealCount = 0;
    if (state.stock.length){
      var n = Math.min(drawCount, state.stock.length);
      revealCount = n;
      for (var i=0; i<n; i++){
        var card = state.stock.pop();
        card.faceUp = true;
        state.waste.push(card);
      }
    } else if (state.waste.length){
      while (state.waste.length){
        var c = state.waste.pop();
        c.faceUp = false;
        state.stock.push(c);
      }
    } else {
      history.pop();
      return;
    }
    selection = null;
    render();
    // skip the buzz during Auto Complete's rapid cascade — one light
    // tap per draw there would just be noise, not feedback
    if (!autocompleting) hapticImpact("LIGHT");
    if (revealCount > 0 && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      // Reveal each newly-drawn card in the fan (oldest of the batch
      // first, newest last, matching how they'd actually be dealt),
      // staggered slightly so a 3-card draw reads as a small cascade
      // instead of all three snapping into place at once.
      var wasteCards = wasteSlot.querySelectorAll(".card");
      var start = Math.max(0, wasteCards.length - revealCount);
      for (var wi = start; wi < wasteCards.length; wi++){
        (function(el, delay){
          setTimeout(function(){ flipRevealEl(el); }, delay);
        })(wasteCards[wi], (wi - start) * 60);
      }
    }
  }

  function checkWin(){
    var total = 0;
    SUITS.forEach(function(s){ total += state.foundations[s].length; });
    if (total === 52){
      setTimeout(function(){
        won = true;
        renderBoard();
        launchConfetti();
        hapticFireworks();
      }, 250);
    }
  }

  function cardEl(card, extraClass){
    var div = document.createElement("div");
    div.className = "card " + (card.faceUp ? "up "+SUIT_COLOR[card.suit] : "down") + (extraClass?(" "+extraClass):"");
    div.dataset.cardId = card.suit + card.rank;
    if (card.faceUp){
      var rankText = rankLabel(card.rank);
      var rankHtml = card.rank === 10 ? '<span class="rank-ten">'+rankText+'</span>' : rankText;
      div.innerHTML =
        '<div class="rank">'+rankHtml+'<span class="suit-mini">'+suitSvg(card.suit)+'</span></div>'+
        '<div class="pip">'+suitSvg(card.suit)+'</div>';
    }
    return div;
  }

  // Snapshot every on-board card's position + face state right before a
  // re-render, then diff against the freshly rebuilt DOM afterward: a
  // card whose position changed gets a FLIP transform animation (starts
  // offset by the delta, transitions to zero); a card that stayed put
  // but flipped face-down->face-up gets a rotateY reveal animation
  // instead. Cards are matched by suit+rank, which is a stable identity
  // since a deck has exactly one of each.
  function captureCardSnapshots(){
    var map = {};
    document.querySelectorAll("[data-card-id]").forEach(function(el){
      map[el.dataset.cardId] = {
        rect: el.getBoundingClientRect(),
        faceUp: el.classList.contains("up")
      };
    });
    return map;
  }

  function flipRevealEl(el){
    if (!el) return;
    el.classList.remove("flip-reveal");
    void el.offsetWidth;
    el.classList.add("flip-reveal");
    el.addEventListener("animationend", function handler(){
      el.classList.remove("flip-reveal");
      el.removeEventListener("animationend", handler);
    }, {once:true});
  }

  function applyCardTransitions(prevSnapshots){
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll("[data-card-id]").forEach(function(el){
      var prev = prevSnapshots[el.dataset.cardId];
      if (!prev) return;
      var newRect = el.getBoundingClientRect();
      var dx = prev.rect.left - newRect.left;
      var dy = prev.rect.top - newRect.top;
      var moved = Math.abs(dx) > 1 || Math.abs(dy) > 1;
      var isNowUp = el.classList.contains("up");
      if (moved){
        var baseTransform = el.style.transform || "";
        // elevate above every other card while animating across the
        // board, so it doesn't visually pass behind later-painted
        // columns/piles — then restore whatever z-index it had before
        // (the waste fan sets its own per-card z-index, which a blind
        // reset would otherwise clobber)
        var baseZIndex = el.style.zIndex || "";
        el.style.zIndex = "50";
        el.style.transition = "none";
        el.style.transform = "translate("+dx+"px,"+dy+"px) " + baseTransform;
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.style.transition = "transform " + (cardMoveMs/1000) + "s ease";
            el.style.transform = baseTransform;
            el.addEventListener("transitionend", function handler(){
              el.style.transition = "";
              el.style.zIndex = baseZIndex;
              el.removeEventListener("transitionend", handler);
            });
          });
        });
      } else if (!prev.faceUp && isNowUp){
        flipRevealEl(el);
      }
    });
  }

  function render(){
    var prevSnapshots = captureCardSnapshots();
    renderBoard();
    applyCardTransitions(prevSnapshots);
  }

  function renderBoard(){
    app.className = handMode;
    drawSwitch.textContent = drawCount + "×";
    // Win replaces the title with a celebration message and the Draw
    // button with a "Play Again" trigger — no modal, the board itself
    // (frozen in its won state, foundations full) stays visible behind
    // them, with the confetti still falling over everything.
    wordmark.innerHTML = won ? "🌟<br>You Win!" : "Lazy<br>Solitaire";
    drawBtn.title = won ? "Play Again" : "Draw";
    drawBtn.innerHTML = "<span>" + (won ? "Play Again" : "Draw") + "</span>";
    // visibility (not display) keeps the row's height reserved so the
    // controls/tableau below it never shift when undo appears/disappears
    var noHistory = history.length === 0;
    undoBtn.classList.toggle("is-hidden", noHistory || won);
    undoBtn.style.pointerEvents = noHistory || won ? "none" : "";
    var showAutocomplete = canAutocomplete();
    autocompleteBtn.classList.toggle("is-hidden", !showAutocomplete || won);
    autocompleteBtn.style.pointerEvents = showAutocomplete && !autocompleting && !won ? "" : "none";
    // Draw is the filled/primary button until Auto Complete becomes
    // available, at which point it steps back to an outline so only
    // one accent-filled button shows at a time. Winning always means
    // Auto Complete has nothing left to offer, so this naturally stays
    // filled for "Play Again" too.
    drawBtn.classList.toggle("outline", showAutocomplete);

    // foundations
    foundationsEl.innerHTML = "";
    SUITS.forEach(function(suit){
      var slot = document.createElement("div");
      slot.className = "foundation";
      slot.dataset.suit = suit;
      var pile = state.foundations[suit];
      // ghost is always present underneath (not just when empty) so the
      // slot never reads as blank while the incoming top card is still
      // mid-flight (it's rendered off in its origin position via a FLIP
      // transform for the first ~200ms and hasn't visually arrived yet)
      slot.insertAdjacentHTML("beforeend", suitSvg(suit, "ghost"));
      if (pile.length){
        // the previous top card stays rendered underneath too, so once
        // there's more than one card in the pile the slot shows a real
        // card (not just the ghost) throughout the incoming card's flight
        if (pile.length >= 2){
          var under = cardEl(pile[pile.length-2]);
          under.style.pointerEvents = "none";
          slot.appendChild(under);
        }
        var top = pile[pile.length-1];
        var topEl = cardEl(top);
        topEl.addEventListener("pointerdown", onCardPointerDown("foundation", suit, -1));
        slot.appendChild(topEl);
      }
      foundationsEl.appendChild(slot);
    });

    // tableau
    tableauEl.innerHTML = "";
    state.tableau.forEach(function(pile, col){
      var colEl = document.createElement("div");
      colEl.className = "col";
      colEl.dataset.col = col;
      if (!pile.length){
        var drop = document.createElement("div");
        drop.className = "empty-drop";
        colEl.appendChild(drop);
      } else {
        var prevFaceUp = null;
        pile.forEach(function(card, idx){
          var el = cardEl(card, "");
          if (prevFaceUp !== null){
            // face-up-under-face-up stays width-relative (needs to keep
            // showing the rank corner at any card size); face-down-under-
            // face-down uses a fixed 8px reveal regardless of card size
            el.style.marginTop = prevFaceUp ? "-102%" : "calc((var(--card-w) * -1.4) + 8px)";
          }
          prevFaceUp = card.faceUp;
          el.addEventListener("pointerdown", onCardPointerDown("tableau", col, idx));
          colEl.appendChild(el);
        });
      }
      tableauEl.appendChild(colEl);
    });

    // waste — in 1-draw mode only the single playable card ever exists,
    // so there's nothing to fan. In 3-draw mode, fan up to 3 cards with
    // enough offset to read each one's rank+suit corner (not just a
    // sliver), extending away from the stock pile so it never covers it.
    // The fan must also keep older cards to the LEFT of newer ones (a
    // card's rank/suit lives in its top-left corner, so a newer card on
    // top only ever hides an older card's right side) — since the stock
    // sits on opposite sides in the two hand modes, which physical card
    // is the unmoved anchor (0 offset) has to flip too, not just the
    // direction cards fan out in.
    wasteSlot.innerHTML = "";
    if (state.waste.length){
      var peekCount = drawCount === 3 ? Math.min(3, state.waste.length) : 1;
      var peekStart = state.waste.length - peekCount;
      var fanDir = handMode === "right" ? -1 : 1;
      var anchorNewest = handMode === "right";
      for (var wi=peekStart; wi<state.waste.length; wi++){
        var recency = state.waste.length - 1 - wi; // 0 = top/newest card
        var isTop = recency === 0;
        var wEl = cardEl(state.waste[wi], "");
        var shiftSteps = anchorNewest ? recency : (peekCount - 1 - recency);
        var fanFraction = (fanDir * shiftSteps * 0.5).toFixed(2);
        var fanX = "calc(var(--card-w) * " + fanFraction + ")";
        wEl.style.setProperty("--fan-x", fanX);
        wEl.style.transform = "translate(" + fanX + ", 0)";
        wEl.style.zIndex = String(10 - recency);
        if (isTop){
          wEl.addEventListener("pointerdown", onCardPointerDown("waste", -1, state.waste.length-1));
        } else {
          wEl.style.pointerEvents = "none";
        }
        wasteSlot.appendChild(wEl);
      }
    } else {
      var wDrop = document.createElement("div");
      wDrop.className = "empty-drop";
      wasteSlot.appendChild(wDrop);
    }

    // stock
    if (state.stock.length){
      stockBtn.className = "stock-btn";
      stockBtn.innerHTML = "";
    } else {
      stockBtn.className = "stock-btn empty";
      stockBtn.innerHTML = ICON_NEWGAME;
    }

    // Once stock and waste are both empty there's nothing left to draw
    // or recycle — disable the whole draw column (button, bridge, and
    // the pile itself) instead of leaving a dead tap target. Stock
    // alone being empty is the normal "tap to recycle" state, so that
    // alone doesn't disable anything. Winning always empties both (every
    // card has to reach a foundation to win), but Draw stays enabled
    // then — it's doing double duty as "Play Again".
    var deckExhausted = !state.stock.length && !state.waste.length;
    drawBtn.disabled = deckExhausted && !won;
    stockBtn.disabled = deckExhausted;
    drawBridge.style.pointerEvents = deckExhausted ? "none" : "";
  }

  // Draw doubles as "Play Again" once the game's won — same button,
  // same tap target, just a different action depending on state.
  function onDrawOrPlayAgain(){
    if (won){ newGame(); return; }
    drawCard();
  }
  stockBtn.addEventListener("click", drawCard);
  drawBtn.addEventListener("click", onDrawOrPlayAgain);
  drawBridge.addEventListener("click", onDrawOrPlayAgain);
  undoBtn.addEventListener("click", undo);
  autocompleteBtn.addEventListener("click", runAutocomplete);
  newGameBtn.addEventListener("click", newGame);
  handSwitch.addEventListener("click", function(){
    handMode = handMode === "right" ? "left" : "right";
    render();
  });
  drawSwitch.addEventListener("click", function(){
    drawCount = drawCount === 1 ? 3 : 1;
    render();
  });
  wordmark.addEventListener("click", function(){
    applyPalette(randomPalette());
  });
  wordmark.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" || ev.key === " "){
      ev.preventDefault();
      applyPalette(randomPalette());
    }
  });

  function launchConfetti(){
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canvas = document.getElementById("confetti");
    if (reduce){ canvas.style.display="none"; return; }
    canvas.style.display = "block";
    var ctx = canvas.getContext("2d");
    var W = canvas.width = window.innerWidth;
    var H = canvas.height = window.innerHeight;
    var rootStyle = getComputedStyle(document.documentElement);
    var colors = ["--brass-500","--brick-600","--paper-100","--felt-600"].map(function(v){
      return rootStyle.getPropertyValue(v).trim();
    });
    var pieces = [];
    for (var i=0;i<90;i++){
      pieces.push({
        x: Math.random()*W,
        y: -20 - Math.random()*H*0.5,
        w: 5+Math.random()*5,
        h: 8+Math.random()*6,
        color: colors[i%colors.length],
        vy: 2+Math.random()*3,
        vx: -1.5+Math.random()*3,
        rot: Math.random()*Math.PI,
        vr: -0.15+Math.random()*0.3
      });
    }
    var start = Date.now();
    function frame(){
      var elapsed = Date.now()-start;
      ctx.clearRect(0,0,W,H);
      pieces.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      });
      if (elapsed < 3200){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,W,H);
        canvas.style.display = "none";
      }
    }
    requestAnimationFrame(frame);
  }

  newGameBtn.innerHTML = "<span>New Game</span>";
  undoBtn.innerHTML = ICON_UNDO;
  autocompleteBtn.innerHTML = ICON_AUTOCOMPLETE;
  handSwitch.innerHTML = ICON_HAND;

  // Some mobile browsers leave vh/dvh stuck at a stale value after a
  // rotate-then-rotate-back cycle instead of recomputing against the
  // restored viewport. Track the real height in JS as a fallback the
  // layout can lean on — resize covers most cases; orientationchange
  // gets an extra delayed re-check since the viewport doesn't always
  // finish settling by the time that event fires.
  function setAppHeight(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--app-height", h + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", setAppHeight);
  }
  // Some mobile browsers take much longer than a single resize event
  // to settle the viewport back to its pre-rotation size after
  // rotating back — a couple of fixed-delay rechecks weren't enough
  // in practice, so keep re-measuring for a while instead of guessing
  // one "safe" delay.
  window.addEventListener("orientationchange", function(){
    var tries = 0;
    var iv = setInterval(function(){
      setAppHeight();
      tries++;
      if (tries > 15) clearInterval(iv);
    }, 100);
  });

  // When wrapped as a native app (Capacitor injects window.Capacitor at
  // runtime — absent entirely on the plain web version, so this is a
  // no-op there), the OS status bar has no browser chrome around it to
  // pick readable icon contrast on its own. Match its icon color to
  // whichever mood's theme just got applied.
  function syncStatusBar(mood){
    var cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    var StatusBar = cap.Plugins && cap.Plugins.StatusBar;
    if (!StatusBar) return;
    // counterintuitively, Style.Dark means "style suited to a dark
    // background" (light icons), and Style.Light means the opposite
    StatusBar.setStyle({style: MOOD_DARK[mood] ? "DARK" : "LIGHT"});
  }

  // Same no-op-on-web guard as syncStatusBar/checkForOTAUpdate above.
  function hapticImpact(style){
    var cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    var Haptics = cap.Plugins && cap.Plugins.Haptics;
    if (!Haptics) return;
    Haptics.impact({style: style}).catch(function(){});
  }
  // A single notification pulse reads as a polite ding, not a
  // celebration — this staggers several impacts of varying strength
  // and irregular timing instead, each one landing like its own
  // firework burst-and-crackle rather than one flat buzz.
  function hapticFireworks(){
    [
      [0,     "HEAVY"],
      [90,    "LIGHT"],
      [170,   "LIGHT"],
      [330,   "MEDIUM"],
      [460,   "HEAVY"],
      [500,   "LIGHT"],
      [620,   "MEDIUM"],
      [780,   "HEAVY"],
      [830,   "LIGHT"],
      [900,   "LIGHT"]
    ].forEach(function(burst){
      setTimeout(function(){ hapticImpact(burst[1]); }, burst[0]);
    });
  }

  // Self-hosted OTA updates (no cloud service): checks a small JSON
  // manifest on the same Vercel deployment the web version lives on
  // for a newer web-bundle version, downloads it, and swaps it in on
  // next launch — same content pipeline as the website, no App Store
  // review needed for ordinary gameplay/UI changes. Runs once per
  // launch, fails silently offline, and never blocks the game the
  // player is already looking at.
  var OTA_MANIFEST_URL = "https://solitaire-snowy.vercel.app/ota/latest.json";
  function checkForOTAUpdate(){
    var cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    var Updater = cap.Plugins && cap.Plugins.CapacitorUpdater;
    if (!Updater) return;
    // Required ack that this bundle loaded successfully — skipping it
    // makes the plugin roll back to the last-known-good bundle.
    Updater.notifyAppReady().catch(function(){});
    fetch(OTA_MANIFEST_URL, {cache: "no-store"})
      .then(function(res){ return res.json(); })
      .then(function(manifest){
        return Updater.current().then(function(cur){
          if (!manifest || !manifest.version || !manifest.url) return;
          if (cur && cur.bundle && cur.bundle.version === manifest.version) return;
          return Updater.download({
            version: manifest.version,
            url: manifest.url,
            checksum: manifest.checksum
          }).then(function(bundle){
            return Updater.set({id: bundle.id});
          });
        });
      })
      .catch(function(){}); // offline or unreachable — just play the current bundle
  }

  var APP_STORE_URL = "https://apps.apple.com/us/app/lazy-solitaire/id6802783512";
  function revealAppStoreBadge(){
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
    appStoreBadge.href = APP_STORE_URL;
    appStoreBadge.hidden = false;
  }

  applyPalette(randomPalette());
  syncStatusBar(getTimeOfDay());
  newGame();
  checkForOTAUpdate();
  revealAppStoreBadge();
})();
</script>
</body>
</html>
