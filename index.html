<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Simple Solitaire</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAAAvNJREFUeAHtmk9SE0EUxr83gIEdSwklzmysAhYmJzCcwPIEhBOoJzCcADgB4QTCCcAbxAVguckQiugyrqiodPs6MOpCqvJ6Znq6sH9VUzPJdHX1+/r1n/d6gEAgEAgEAoFAIBD4DyFUQP/xeTwbYVNr3eCfixroKU17ydfVFI5xLsDl0qfXCmr3X+8ios6T4eo2HBLBIZf183f3GW9QWndMGTjEmQdMjGcDpynr0hOcCCAxPsOVCKULYGN8hgsRShUgj/EZZYtQmgCD+vk+L3NtFAA3cnfly9pblEApAhRpfAaR7q4M17dQMIULUIbxGWWIUKgAZRqfUbQIhQjQj/uL0fj6mB8bcENP1RY2kjQZISe5BajA+IxCRMi9Fa7IeENjZnz9HjnJJcBg6WwH1Rg/gaPI1qB+uo8cWAtgNjncgDeoGK2pfbF0Zt0OqznAxPMR6T48gvMJG5xPOIEQKw9g44/hGdymHVggFqC/fNrmWwz/aAxu2yZCLECkyGnCQoSiTQgRCcC9b2b8GJ5iVoX+8mfRqiQSgHu/Bc+J1M+WqDxEqBieQ0TPJeVlAlC0iAeG06ywj8gE0Cp39FU2HI5/k5QXCaAi6sFziGZOJOVlHjD3/RCec6OUqJNEAiRpc8TBwwm8RR9JzxfFk+CNJqdndxJUNNeBELEAtxGX2oNn8PrfTa6eiecoq2VQ1X50+JbCH9KbR/NW5wZWApi5wMTf8EOEdJILsMwNWm+EzGSjauOmIhzAjr/dNYUFPCEfcmK0mefDilw7QeMJyXCtzT2wBdJTjT+ziqhIN7n80Z8/9QHXkUwr5qQO7nU+LnuVNytc6MGICZdNxMiVvsDtpy8xmd4lnXLu7iP3Vjdr8EX9tAN9l1sgvf10uN6Z1MHpNr61Zki/zOrg9yPSlPLzBza8Z5P6uo9ZFEhytW68wFy7sOTOnbt3V+mEYAhVoen32CUVpaiIQoeABF5BuhjXYg7fRphf8D7GCAQCgUAgEAgEHhi/AHDNLlP2GeHvAAAAAElFTkSuQmCC">
<style>
  :root{
    --ink-900:#12211c;
    --felt-700:#2c4238;
    --felt-600:#3a5548;
    --felt-border:#1f2f27;
    --paper-100:#f4ecd8;
    --paper-border:#ddceac;
    --brass-500:#c9a24b;
    --brass-400:#ddb968;
    --brick-600:#a6432f;
    --charcoal-900:#26221d;
    --text-color:#f4ecd8;
    --heading-color:#c96a4a;
    --on-brass:#12211c;
    --gap: 6px;
    --topbar-h: 52px;
    /* single source of truth for every card-sized element (tableau,
       foundations, waste, draw) so they all render at the same size —
       mirrors the tableau's own 7-column-minus-gaps math */
    --card-w: calc((min(520px, 100vw - 20px) - 6 * var(--gap)) / 7);
    font-variant-numeric: tabular-nums;
  }
  /* touch-action:manipulation disables the double-tap-to-zoom gesture
     (which otherwise fires on rapid repeated taps of a button, e.g.
     undo or the draw pile) while still allowing normal scrolling;
     .card overrides this to "none" since drag handles all its own
     touch behavior */
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; tap-highlight-color: transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    min-height:calc(var(--app-height, 100dvh));
    background:var(--ink-900);
    color:var(--text-color);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  .display{
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    letter-spacing:0.01em;
  }

  #app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    min-height:calc(var(--app-height, 100dvh));
  }

  /* ---------- top bar: title only ---------- */
  .topbar{
    min-height:var(--topbar-h);
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 16px 6px;
  }
  .wordmark{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--heading-color);
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .wordmark:active{transform:scale(0.96);}

  /* ---------- main play surface: spread across the viewport so the
     frequently-tapped controls sit in the thumb's natural resting arc
     rather than glued to the very bottom edge ---------- */
  .surface{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    padding:6px 10px calc(18px + env(safe-area-inset-bottom));
    display:flex;
  }
  .table{
    max-width:520px;
    width:100%;
    margin:0 auto;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
  }
  /* lead is a FIXED offset (not flex-grow) so the play group's top
     position never depends on its own content height — otherwise a
     taller tableau or the undo button appearing/disappearing would
     shrink/grow this spacer and shift the whole play area. trail is
     the only elastic one, absorbing whatever's left before the
     bottom bar. */
  .spacer{flex:1 1 0%;}
  .spacer-lead{flex:0 0 auto; height:calc(var(--app-height, 100dvh) * 0.24);}
  .spacer-trail{flex-grow:1;}
  .play-group{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
  }

  .foundations{
    display:flex;
    gap:var(--gap);
    flex:0 0 auto;
  }
  .foundation{
    width:var(--card-w);
    flex:0 0 auto;
    aspect-ratio:5/7;
    border-radius:8px;
    border:1.5px dashed var(--felt-border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .foundation:has(.card){border-style:solid;}
  .foundation .ghost{
    width:clamp(16px,5.2vw,24px);
    height:clamp(16px,5.2vw,24px);
    color:var(--felt-border);
    opacity:0.7;
  }
  /* explicit width (not inset:0) so this always matches every other
     card's size exactly, regardless of the foundation's own border
     eating into inset:0's padding-box reference */
  .foundation .card{position:absolute; top:0; left:0; width:var(--card-w); margin:0;}

  .tableau{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:var(--gap);
  }
  .col{
    display:flex;
    flex-direction:column;
    min-height:24px;
  }

  .card{
    aspect-ratio:5/7;
    border-radius:8px;
    border:1px solid transparent;
    display:flex;
    flex-direction:column;
    gap:14%;
    padding:4% 8%;
    position:relative;
    cursor:pointer;
    touch-action:none;
    transition:transform .12s ease;
  }
  .card.up{
    background:var(--paper-100);
    border-color:var(--paper-border);
  }
  .card.down{
    background:var(--felt-700);
    border-color:var(--felt-border);
  }
  .card.red{color:var(--brick-600);}
  .card.black{color:var(--charcoal-900);}
  .card .rank{
    min-height:26%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-size:clamp(10px, calc(var(--card-w) * 0.333), 20px);
    font-weight:700;
    line-height:1;
  }
  .rank-ten{letter-spacing:-0.08em;}
  .card .suit-mini{font-size:0.75em;}
  .card .pip{
    align-self:center;
    font-size:clamp(18px, calc(var(--card-w) * 0.667), 42px);
    line-height:1;
  }
  .suit-icon{width:1em; height:1em; display:inline-block; vertical-align:-0.14em;}
  .ui-icon{width:1em; height:1em; display:block;}
  .card.bounce{animation:bounce .32s ease;}
  @keyframes bounce{
    0%{transform:translateY(0);}
    35%{transform:translateY(-10px);}
    65%{transform:translateY(2px);}
    100%{transform:translateY(0);}
  }
  .card.flip-reveal{animation:flip-reveal .28s ease;}
  @keyframes flip-reveal{
    0%{transform:rotateY(90deg); filter:brightness(0.7);}
    100%{transform:rotateY(0deg); filter:brightness(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
    .card.bounce{animation:none;}
    .card.flip-reveal{animation:none;}
  }

  .empty-drop{
    border:1.5px dashed var(--felt-border);
    border-radius:7px;
    aspect-ratio:5/7;
  }
  .col.drop-target, .foundation.drop-target{
    outline:3px solid var(--brass-400);
    outline-offset:-3px;
    border-radius:7px;
  }

  /* ---------- undo row + controls row: sit just above the tableau,
     mirrored by hand mode so the frequently-tapped stock/waste side
     lands in the thumb's natural resting arc ---------- */
  .undo-row{
    flex:0 0 auto;
    display:flex;
    margin-bottom:40px;
  }
  #app.right .undo-row{justify-content:flex-end;}
  #app.left .undo-row{justify-content:flex-start;}

  .undo-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    min-height:40px;
    padding:0 14px;
    border:1px solid var(--felt-border);
    border-radius:10px;
    background:transparent;
    color:var(--text-color);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .undo-btn .ui-icon{width:16px; height:16px;}
  .undo-btn:active{background:var(--felt-700);}

  .controls-row{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  #app.left .controls-row{flex-direction:row;}
  #app.right .controls-row{flex-direction:row-reverse;}
  .stock-waste{flex:0 0 auto; display:flex; gap:10px;}
  #app.right .stock-waste{margin-right:24px;}
  #app.left .stock-waste{margin-left:24px;}
  #app.left .stock-waste{flex-direction:row;}
  #app.right .stock-waste{flex-direction:row-reverse;}

  .dock-slot{
    flex:0 0 auto;
    width:var(--card-w);
    aspect-ratio:5/7;
  }
  .waste-slot{position:relative;}
  .waste-slot .card{position:absolute; top:0; left:0; width:var(--card-w); margin:0;}
  .waste-slot .empty-drop{width:100%; height:100%;}

  .stock-btn{
    flex:0 0 auto;
    width:var(--card-w);
    aspect-ratio:5/7;
    border-radius:8px;
    border:1px solid var(--felt-border);
    background:var(--felt-700);
    color:var(--text-color);
    position:relative;
    cursor:pointer;
    padding:0;
  }
  .stock-btn:active{filter:brightness(1.12);}
  .stock-btn .ui-icon{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:38%; height:38%;
  }
  .stock-btn.empty{background:transparent; border-style:dashed;}

  /* ---------- bottom bar: New Game, draw-count, hand-mode. Mirrors to
     the thumb's side like the other controls; reversing the row order
     when flipped keeps New Game closest to the screen edge either way ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding-top:4px;
  }
  #app.left .bottom-bar{flex-direction:row;}
  #app.right .bottom-bar{flex-direction:row-reverse;}
  .newgame-btn, .draw-toggle, .hand-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:44px;
    padding:0 16px;
    border:1px solid var(--felt-border);
    border-radius:10px;
    background:var(--felt-700);
    color:var(--text-color);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .newgame-btn:active, .draw-toggle:active, .hand-toggle:active{filter:brightness(1.15);}
  .newgame-btn .ui-icon{width:16px; height:16px;}
  .draw-toggle{min-width:44px; padding:0 12px;}
  .hand-toggle{min-width:44px; padding:0;}
  .hand-toggle .ui-icon{width:18px; height:18px; transition:transform .18s ease;}
  #app.left .hand-toggle .ui-icon{transform:scaleX(-1);}

  /* ---------- win overlay ---------- */
  .win-overlay{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(18,33,28,0.82);
    z-index:20;
    text-align:center;
    padding:24px;
  }
  .win-overlay.show{display:flex;}
  .win-card{
    background:var(--paper-100);
    color:var(--charcoal-900);
    border-radius:16px;
    padding:32px 28px;
    max-width:320px;
  }
  .win-card h2{
    font-family:inherit;
    margin:0 0 6px;
    font-size:26px;
    color:var(--brick-600);
  }
  .win-card p{margin:0 0 18px; font-size:14px; opacity:0.75;}
  .win-card button{
    min-height:48px;
    padding:0 24px;
    border-radius:10px;
    border:none;
    background:var(--brass-500);
    color:var(--on-brass);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  canvas#confetti{position:fixed; inset:0; z-index:19; pointer-events:none;}
</style>
</head>
<body>

<div id="app" class="right">
  <div class="topbar">
    <h1 class="wordmark" id="wordmark" role="button" tabindex="0" aria-label="Shuffle color palette">Simple Solitaire</h1>
  </div>

  <div class="surface">
    <div class="table">
      <div class="spacer spacer-lead"></div>
      <div class="play-group">
        <div class="undo-row">
          <button class="undo-btn" id="undoBtn" title="Undo"></button>
        </div>
        <div class="controls-row">
          <div class="stock-waste">
            <button class="stock-btn" id="stockBtn"></button>
            <div class="dock-slot waste-slot" id="wasteSlot"></div>
          </div>
          <div class="foundations" id="foundations"></div>
        </div>
        <div class="tableau" id="tableau"></div>
      </div>
      <div class="spacer spacer-trail"></div>
      <div class="bottom-bar">
        <button class="newgame-btn" id="newGameBtn"></button>
        <button class="draw-toggle" id="drawSwitch" aria-label="Toggle 1-card or 3-card draw"></button>
        <button class="hand-toggle" id="handSwitch" aria-label="Toggle left/right-handed mode"></button>
      </div>
    </div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>You win!</h2>
    <p id="winStats"></p>
    <button id="playAgainBtn">Play again</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
  var SUITS = ["S","H","D","C"];
  var SUIT_COLOR = {S:"black",H:"red",D:"red",C:"black"};
  var RANK_LABEL = {1:"A",11:"J",12:"Q",13:"K"};

  var state = null;
  var history = [];
  var selection = null; // {pile:'tableau'|'waste', col:number, idx:number}
  var handMode = "right";
  var drawCount = 1;
  var moveCount = 0;

  var app = document.getElementById("app");
  var foundationsEl = document.getElementById("foundations");
  var tableauEl = document.getElementById("tableau");
  var stockBtn = document.getElementById("stockBtn");
  var wasteSlot = document.getElementById("wasteSlot");
  var undoBtn = document.getElementById("undoBtn");
  var newGameBtn = document.getElementById("newGameBtn");
  var handSwitch = document.getElementById("handSwitch");
  var drawSwitch = document.getElementById("drawSwitch");
  var winOverlay = document.getElementById("winOverlay");
  var winStats = document.getElementById("winStats");
  var playAgainBtn = document.getElementById("playAgainBtn");
  var wordmark = document.getElementById("wordmark");

  function rankLabel(r){ return RANK_LABEL[r] || String(r); }

  // Lucide icon paths (ISC license), inlined so the game has no CDN dependency.
  var SUIT_PATH = {
    S: '<path d="M2 14.499a5.5 5.5 0 0 0 9.591 3.675.6.6 0 0 1 .818.001A5.5 5.5 0 0 0 22 14.5c0-2.29-1.5-4-3-5.5l-5.492-5.312a2 2 0 0 0-3-.02L5 8.999c-1.5 1.5-3 3.2-3 5.5"/>',
    H: '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>',
    D: '<path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/>',
    C: '<path d="M17.28 9.05a5.5 5.5 0 1 0-10.56 0A5.5 5.5 0 1 0 12 17.66a5.5 5.5 0 1 0 5.28-8.6Z"/>'
  };
  var ICON_UNDO = '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>';
  var ICON_NEWGAME = '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
  var ICON_HAND = '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>';

  function suitSvg(suit, extraClass){
    return '<svg class="suit-icon '+(extraClass||"")+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+SUIT_PATH[suit]+'</svg>';
  }

  function hsl(h,s,l){
    l = Math.max(0, Math.min(100, l));
    s = Math.max(0, Math.min(100, s));
    return "hsl("+((h%360+360)%360).toFixed(0)+", "+s.toFixed(0)+"%, "+l.toFixed(0)+"%)";
  }
  function between(min,max){ return min + Math.random()*(max-min); }

  // ---------- WCAG 2.1 contrast verification ----------
  // Every generated palette gets checked against real contrast math
  // (not just eyeballed lightness gaps) and repaired if it falls
  // short, so "looks about right" can't slip through as "fails for
  // someone with low vision."
  function hslToRgb(h,s,l){
    h=((h%360)+360)%360; s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r,g,b;
    if (h<60){r=c;g=x;b=0;} else if (h<120){r=x;g=c;b=0;} else if (h<180){r=0;g=c;b=x;}
    else if (h<240){r=0;g=x;b=c;} else if (h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    return [(r+m)*255,(g+m)*255,(b+m)*255];
  }
  function relLuminance(rgb){
    var a = rgb.map(function(v){
      v/=255;
      return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
    });
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
  }
  function contrastOf(c1,c2){
    var L1=relLuminance(hslToRgb(c1.h,c1.s,c1.l));
    var L2=relLuminance(hslToRgb(c2.h,c2.s,c2.l));
    var hi=Math.max(L1,L2), lo=Math.min(L1,L2);
    return (hi+0.05)/(lo+0.05);
  }
  // Nudges fg's lightness away from bg (toward whichever pole has
  // more relative luminance headroom) until the WCAG contrast ratio
  // target is met, plus a small safety margin — hsl() rounds lightness
  // to a whole number when it's stringified for CSS, which can shave
  // a few hundredths off a ratio that only just cleared the target.
  // 4.5:1 = AA for normal text; 3:1 = AA for UI-component borders
  // (WCAG 1.4.11) and large text. Direction is chosen from actual
  // relative luminance, not raw HSL lightness — the two can disagree
  // by hue (a "light" blue can be less luminant than a "darker"
  // yellow), which was silently pushing some colors the wrong way.
  function ensureContrast(fg, bg, target){
    var bgLum = relLuminance(hslToRgb(bg.h, bg.s, bg.l));
    var fgLum = relLuminance(hslToRgb(fg.h, fg.s, fg.l));
    var dir = fgLum >= bgLum ? 1 : -1;
    var safeTarget = target + 0.15;
    var iter = 0;
    // Normally only fg moves (further toward whichever pole it's
    // already leaning). But if fg starts on the wrong side entirely —
    // e.g. a saturated yellow-green background reads far brighter
    // than its HSL "lightness" suggests, so a foreground picked to be
    // "the light one" can end up stuck near-white with no room left
    // to out-brighten it — pin fg at its exhausted extreme and ease
    // bg the opposite way instead of giving up.
    while (contrastOf(fg,bg) < safeTarget && iter < 200){
      var fgHasRoom = dir>0 ? fg.l<100 : fg.l>0;
      if (fgHasRoom){
        fg.l = Math.max(0, Math.min(100, fg.l + dir*0.6));
      } else {
        bg.l = Math.max(0, Math.min(100, bg.l - dir*0.6));
      }
      iter++;
    }
    return fg;
  }

  // ---------- time-of-day themes ----------
  // Reads the player's own device clock (their local time, not a
  // server's) and picks a curated hue/saturation/lightness recipe for
  // that part of the day, rather than rolling a uniformly random
  // palette. Each recipe fixes a light/dark bias that matches how
  // that time of day actually looks (morning and daytime read bright,
  // dusk and night read dark) plus a handful of hue "bands" (sunrise
  // peach, midday sky-blue, sunset plum, midnight indigo, etc.) so a
  // reload still lands on a genuinely different-but-appropriate look
  // each time instead of one fixed palette per period.
  function getTimeOfDay(){
    var h = new Date().getHours();
    if (h >= 5 && h < 11) return "morning";
    if (h >= 11 && h < 17) return "daytime";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }

  var TIME_THEMES = {
    morning: { // soft pastel sunrise — light, airy, gentle
      dark:false,
      bgHueBands:[[18,42],[344,368],[46,62]],
      bgSat:[16,30], bgL:[91,97],
      accentSat:[48,66], accentL:[56,68],
      suitHueBands:[[3,22],[150,172]]
    },
    daytime: { // vivid clear daylight — bright, saturated, energetic
      dark:false,
      bgHueBands:[[196,214],[92,138],[14,34]],
      bgSat:[28,46], bgL:[88,95],
      accentSat:[60,80], accentL:[48,60],
      suitHueBands:[[358,382],[128,152]]
    },
    dusk: { // warm golden-hour glow — dark but warm, not moody
      dark:true,
      bgHueBands:[[8,28],[282,318],[30,46]],
      bgSat:[34,50], bgL:[15,25],
      accentSat:[56,76], accentL:[52,64],
      suitHueBands:[[350,374],[298,322]]
    },
    night: { // deep moody midnight — cool, jewel-toned, low-lit
      dark:true,
      bgHueBands:[[220,248],[258,284],[182,202]],
      bgSat:[26,40], bgL:[7,15],
      accentSat:[42,60], accentL:[46,58],
      suitHueBands:[[340,364],[152,176]]
    }
  };

  function pickBand(bands){
    var b = bands[Math.floor(Math.random()*bands.length)];
    return between(b[0], b[1]);
  }

  function randomPalette(){
    var theme = TIME_THEMES[getTimeOfDay()];
    var darkMode = theme.dark;
    var baseHue = pickBand(theme.bgHueBands);
    var schemes = ["mono","analogous","complementary","triadic","splitComplementary"];
    var scheme = schemes[Math.floor(Math.random()*schemes.length)];
    var accentHue = baseHue;
    if (scheme === "analogous") accentHue = baseHue + 30;
    else if (scheme === "complementary") accentHue = baseHue + 180;
    else if (scheme === "triadic") accentHue = baseHue + 120;
    else if (scheme === "splitComplementary") accentHue = baseHue + 150;
    var feltHue = baseHue + 15;
    var dir = darkMode ? 1 : -1;

    var ink900 = {h:baseHue, s:between(theme.bgSat[0],theme.bgSat[1]), l:between(theme.bgL[0],theme.bgL[1])};
    var fillL = ink900.l + dir*between(12,20);
    var felt700 = {h:feltHue, s:between(24,36), l:fillL};
    var text = {h:baseHue, s:between(10,26), l: darkMode ? between(90,98) : between(8,20)};
    // heading-color is its own token (not reused for suit text) since
    // it only ever has to contrast against the page background, while
    // the suit colors below have the separate, sometimes-conflicting
    // job of contrasting against the always-light card paper
    var heading = {h:accentHue, s:between(55,75), l: darkMode ? between(62,74) : between(28,40)};
    var paper = {h:accentHue, s:between(24,42), l:between(90,94)};
    var brass = {h:accentHue, s:between(theme.accentSat[0],theme.accentSat[1]), l:between(theme.accentL[0],theme.accentL[1])};
    var brass400 = {h:accentHue, s:Math.max(0,brass.s-6), l:Math.min(96,brass.l+14)};
    var onBrass = {h:baseHue, s:Math.min(100,ink900.s+10), l: brass.l >= 50 ? 12 : 92};

    var suitWarm = {h:pickBand([theme.suitHueBands[0]]), s:between(55,75), l:between(40,52)};
    var suitCool = {h:pickBand([theme.suitHueBands[1]]), s:between(45,65), l:between(20,32)};

    // felt-border/paper-border are shades of felt-700/paper-100 (same
    // hue+sat, lightness pushed further along the same staircase
    // direction) so every dashed outline and card-back border reads
    // as "a shade of its own surface," never an unrelated accent color
    var feltBorder = {h:feltHue, s:felt700.s, l:felt700.l + dir*between(10,16)};
    var paperBorder = {h:accentHue, s:paper.s, l:paper.l - between(8,12)};

    // ---- accessibility repairs (WCAG 2.1 AA) ----
    ensureContrast(text, ink900, 4.5);     // page text/icons vs page bg
    ensureContrast(text, felt700, 4.5);    // button text/icons vs their fill
    ensureContrast(heading, ink900, 4.5);  // title vs page bg
    ensureContrast(onBrass, brass, 4.5);   // win-dialog button text vs its fill
    ensureContrast(suitWarm, paper, 4.5);  // red-suit rank/icon vs card face
    ensureContrast(suitCool, paper, 4.5);  // black-suit rank/icon vs card face
    ensureContrast(feltBorder, felt700, 3.0); // card-back/button border vs its fill
    ensureContrast(feltBorder, ink900, 3.0);  // same border where it shows on bare page bg
    ensureContrast(paperBorder, paper, 3.0);  // card-face border vs its fill
    ensureContrast(brass400, ink900, 3.0);    // drag drop-target outline vs page bg

    return {
      "--ink-900": hsl(ink900.h, ink900.s, ink900.l),
      "--felt-700": hsl(felt700.h, felt700.s, felt700.l),
      "--felt-600": hsl(feltHue, between(24,36), fillL + dir*between(4,8)),
      "--felt-border": hsl(feltBorder.h, feltBorder.s, feltBorder.l),
      "--text-color": hsl(text.h, text.s, text.l),
      "--heading-color": hsl(heading.h, heading.s, heading.l),
      "--paper-100": hsl(paper.h, paper.s, paper.l),
      "--paper-border": hsl(paperBorder.h, paperBorder.s, paperBorder.l),
      "--brass-500": hsl(brass.h, brass.s, brass.l),
      "--brass-400": hsl(brass400.h, brass400.s, brass400.l),
      "--on-brass": hsl(onBrass.h, onBrass.s, onBrass.l),
      "--brick-600": hsl(suitWarm.h, suitWarm.s, suitWarm.l),
      "--charcoal-900": hsl(suitCool.h, suitCool.s, suitCool.l)
    };
  }

  function applyPalette(vars){
    var root = document.documentElement.style;
    Object.keys(vars).forEach(function(k){ root.setProperty(k, vars[k]); });
  }

  function freshDeck(){
    var deck = [];
    for (var s=0; s<SUITS.length; s++){
      for (var r=1; r<=13; r++){
        deck.push({suit:SUITS[s], rank:r, faceUp:false});
      }
    }
    for (var i=deck.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = deck[i]; deck[i]=deck[j]; deck[j]=t;
    }
    return deck;
  }

  function newGame(){
    var deck = freshDeck();
    var tableau = [[],[],[],[],[],[],[]];
    for (var c=0; c<7; c++){
      for (var k=0; k<=c; k++){
        var card = deck.pop();
        card.faceUp = (k===c);
        tableau[c].push(card);
      }
    }
    state = {
      tableau: tableau,
      stock: deck,
      waste: [],
      foundations: {S:[],H:[],D:[],C:[]}
    };
    history = [];
    selection = null;
    moveCount = 0;
    winOverlay.classList.remove("show");
    renderBoard(); // skip the move/reveal transition for a full reshuffle
  }

  function snapshot(){
    return JSON.parse(JSON.stringify(state));
  }
  function pushHistory(){
    history.push(snapshot());
    if (history.length>200) history.shift();
  }
  function undo(){
    if (!history.length) return;
    state = history.pop();
    selection = null;
    if (moveCount>0) moveCount--;
    render();
  }

  function topCard(col){
    var pile = state.tableau[col];
    return pile.length ? pile[pile.length-1] : null;
  }

  function canStackTableau(card, destCol){
    var pile = state.tableau[destCol];
    if (!pile.length) return card.rank === 13;
    var top = pile[pile.length-1];
    if (!top.faceUp) return false;
    var altColor = SUIT_COLOR[card.suit] !== SUIT_COLOR[top.suit];
    return altColor && card.rank === top.rank - 1;
  }

  function canStackFoundation(card, suit){
    var pile = state.foundations[suit];
    if (card.suit !== suit) return false;
    if (!pile.length) return card.rank === 1;
    return card.rank === pile[pile.length-1].rank + 1;
  }

  function flipExposed(col){
    var pile = state.tableau[col];
    if (pile.length){
      var top = pile[pile.length-1];
      if (!top.faceUp) top.faceUp = true;
    }
  }

  function getSelectedCards(){
    if (!selection) return [];
    if (selection.pile==="waste") return [state.waste[state.waste.length-1]];
    if (selection.pile==="foundation") return [state.foundations[selection.col][state.foundations[selection.col].length-1]];
    return state.tableau[selection.col].slice(selection.idx);
  }

  function removeSelectedFromSource(){
    if (selection.pile==="waste"){
      return [state.waste.pop()];
    }
    if (selection.pile==="foundation"){
      return [state.foundations[selection.col].pop()];
    }
    var pile = state.tableau[selection.col];
    var cards = pile.splice(selection.idx);
    flipExposed(selection.col);
    return cards;
  }

  function moveSelectionToTableau(destCol){
    var cards = getSelectedCards();
    if (!cards.length) return false;
    if (!canStackTableau(cards[0], destCol)) return false;
    if (selection.pile==="tableau" && selection.col===destCol) return false;
    pushHistory();
    var moved = removeSelectedFromSource();
    for (var i=0;i<moved.length;i++) state.tableau[destCol].push(moved[i]);
    moveCount++;
    selection = null;
    render();
    return true;
  }

  function moveSelectionToFoundation(suit){
    var cards = getSelectedCards();
    if (cards.length !== 1) return false;
    if (!canStackFoundation(cards[0], suit)) return false;
    pushHistory();
    var moved = removeSelectedFromSource();
    state.foundations[suit].push(moved[0]);
    moveCount++;
    selection = null;
    render();
    checkWin();
    return true;
  }

  function bounceEl(el){
    if (!el) return;
    el.classList.remove("bounce");
    void el.offsetWidth;
    el.classList.add("bounce");
  }

  // Tap a card: if it has any legal move, play it automatically
  // (foundation preferred, else the first open tableau column).
  // If it has none, bounce it in place. Precise placement is done by
  // dragging instead — see the pointer-drag machinery below.
  function findAutoDestination(cards, excludeCol){
    if (cards.length === 1 && canStackFoundation(cards[0], cards[0].suit)){
      return {type:"foundation", suit:cards[0].suit};
    }
    for (var c=0; c<7; c++){
      if (c === excludeCol) continue;
      if (canStackTableau(cards[0], c)) return {type:"tableau", col:c};
    }
    return null;
  }

  function performTapMove(pile, col, idx, el){
    var cards;
    if (pile === "tableau"){
      var card = state.tableau[col][idx];
      if (!card.faceUp) return; // face-down cards aren't playable — no bounce, just ignore the tap
      cards = state.tableau[col].slice(idx);
    } else if (pile === "foundation"){
      if (!state.foundations[col].length) return;
      cards = [state.foundations[col][state.foundations[col].length-1]];
    } else {
      if (!state.waste.length) return;
      cards = [state.waste[state.waste.length-1]];
    }
    var dest = findAutoDestination(cards, pile==="tableau" ? col : -1);
    if (!dest){ bounceEl(el); return; }
    selection = pile==="tableau" ? {pile:"tableau", col:col, idx:idx}
      : pile==="foundation" ? {pile:"foundation", col:col, idx:-1}
      : {pile:"waste", col:-1, idx:state.waste.length-1};
    if (dest.type === "foundation") moveSelectionToFoundation(dest.suit);
    else moveSelectionToTableau(dest.col);
  }

  // ---------- drag-and-drop: lets the player choose an exact
  // destination instead of the automatic one. A pointerdown starts
  // tracking; if the pointer moves past a small threshold before
  // release, it becomes a real drag (cards follow the pointer via
  // fixed-position + translate on the live DOM nodes — render()
  // naturally discards those inline styles on the next redraw, so no
  // separate ghost/cleanup bookkeeping is needed). Release with no
  // meaningful movement is treated as a tap instead. ----------
  var drag = null;

  function onCardPointerDown(pile, col, idx){
    return function(ev){
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      var faceUp = pile !== "tableau" || !!(state.tableau[col][idx] && state.tableau[col][idx].faceUp);
      var cards = null;
      if (faceUp){
        if (pile === "tableau") cards = state.tableau[col].slice(idx);
        else if (pile === "foundation") cards = state.foundations[col].length ? [state.foundations[col][state.foundations[col].length-1]] : null;
        else cards = [state.waste[state.waste.length-1]];
      }
      drag = {
        pile: pile, col: col, idx: idx,
        cards: cards,
        startX: ev.clientX, startY: ev.clientY,
        active: false,
        dragEls: null,
        sourceEl: ev.currentTarget
      };
      try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch(e){}
      ev.preventDefault();
      window.addEventListener("pointermove", onDragMove);
      window.addEventListener("pointerup", onDragEnd);
      window.addEventListener("pointercancel", onDragCancel);
    };
  }

  function activateDrag(){
    drag.active = true;
    var els;
    if (drag.pile === "waste"){
      els = [wasteSlot.querySelector(".card:last-child")];
    } else if (drag.pile === "foundation"){
      var slot = foundationsEl.querySelector('[data-suit="'+drag.col+'"]');
      els = [slot.querySelector(".card")];
    } else {
      var colEl = tableauEl.children[drag.col];
      els = Array.prototype.slice.call(colEl.querySelectorAll(".card"), drag.idx);
    }
    drag.dragEls = els;
    els.forEach(function(el, i){
      // A card grabbed moments after it moved or got revealed can
      // still be mid-animation (a CSS transition easing its FLIP
      // transform back to rest, or the flip-reveal keyframe rotating
      // it through rotateY(90deg)) — measuring its rect in that state
      // gives a squashed or zero-width box. Snap it to its true
      // resting layout first. The only card this ever runs on that
      // has a real non-empty resting transform is the top waste card,
      // whose fan offset at depth 0 is a translate(0,0) no-op, so
      // clearing it is always safe.
      el.style.transition = "none";
      el.style.transform = "";
      el.classList.remove("flip-reveal", "bounce");
      var r = el.getBoundingClientRect();
      el.style.position = "fixed";
      el.style.margin = "0";
      el.style.left = r.left+"px";
      el.style.top = r.top+"px";
      el.style.width = r.width+"px";
      el.style.height = r.height+"px";
      el.style.zIndex = 500+i;
      el.style.pointerEvents = "none";
      el.classList.add("dragging");
    });
  }

  function positionDragEls(x, y){
    var dx = x-drag.startX, dy = y-drag.startY;
    drag.dragEls.forEach(function(el){
      el.style.transform = "translate("+dx+"px,"+dy+"px) scale(1.03)";
    });
  }

  function findDropTarget(x, y){
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    var foundationEl = el.closest(".foundation");
    if (foundationEl) return {type:"foundation", suit:foundationEl.dataset.suit, el:foundationEl};
    var colEl = el.closest(".col");
    if (colEl) return {type:"tableau", col:Number(colEl.dataset.col), el:colEl};
    return null;
  }

  function clearDropHighlight(){
    var els = document.querySelectorAll(".drop-target");
    for (var i=0;i<els.length;i++) els[i].classList.remove("drop-target");
  }

  function updateDropHighlight(x, y){
    clearDropHighlight();
    if (!drag.cards) return;
    var target = findDropTarget(x, y);
    if (!target) return;
    var legal = target.type === "foundation"
      ? (drag.cards.length===1 && canStackFoundation(drag.cards[0], target.suit))
      : (canStackTableau(drag.cards[0], target.col) && !(drag.pile==="tableau" && drag.col===target.col));
    if (legal) target.el.classList.add("drop-target");
  }

  function onDragMove(ev){
    if (!drag) return;
    var dx = ev.clientX-drag.startX, dy = ev.clientY-drag.startY;
    if (!drag.active){
      if (drag.cards && Math.hypot(dx,dy) > 8) activateDrag();
      else return;
    }
    positionDragEls(ev.clientX, ev.clientY);
    updateDropHighlight(ev.clientX, ev.clientY);
  }

  function endPointerTracking(){
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", onDragEnd);
    window.removeEventListener("pointercancel", onDragCancel);
  }

  function onDragEnd(ev){
    endPointerTracking();
    if (!drag) return;
    var d = drag;
    drag = null;
    clearDropHighlight();
    if (d.active){
      var target = findDropTarget(ev.clientX, ev.clientY);
      var moved = false;
      if (target){
        selection = d.pile==="tableau" ? {pile:"tableau", col:d.col, idx:d.idx}
          : d.pile==="foundation" ? {pile:"foundation", col:d.col, idx:-1}
          : {pile:"waste", col:-1, idx:state.waste.length-1};
        moved = target.type === "foundation" ? moveSelectionToFoundation(target.suit) : moveSelectionToTableau(target.col);
      }
      if (!moved){
        render();
        var el = d.pile==="tableau"
          ? (tableauEl.children[d.col] && tableauEl.children[d.col].children[d.idx])
          : d.pile==="foundation"
            ? (foundationsEl.querySelector('[data-suit="'+d.col+'"] .card'))
            : wasteSlot.querySelector(".card:last-child");
        bounceEl(el);
      }
    } else {
      performTapMove(d.pile, d.col, d.idx, d.sourceEl);
    }
  }

  function onDragCancel(){
    endPointerTracking();
    if (drag && drag.active) render();
    drag = null;
    clearDropHighlight();
  }

  function drawCard(){
    pushHistory();
    // a card moving stock->waste has no on-screen "before" element (the
    // stock pile doesn't render individual cards), so the generic FLIP
    // system in render() can't detect it and animate it — give the new
    // top waste card its own flip-reveal explicitly. Scoped to 1-draw,
    // where there's always exactly one unambiguous card to animate.
    var willRevealSingle = drawCount === 1 && state.stock.length > 0;
    if (state.stock.length){
      var n = Math.min(drawCount, state.stock.length);
      for (var i=0; i<n; i++){
        var card = state.stock.pop();
        card.faceUp = true;
        state.waste.push(card);
      }
    } else if (state.waste.length){
      while (state.waste.length){
        var c = state.waste.pop();
        c.faceUp = false;
        state.stock.push(c);
      }
    } else {
      history.pop();
      return;
    }
    selection = null;
    render();
    if (willRevealSingle && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      flipRevealEl(wasteSlot.querySelector(".card:last-child"));
    }
  }

  function checkWin(){
    var total = 0;
    SUITS.forEach(function(s){ total += state.foundations[s].length; });
    if (total === 52){
      setTimeout(function(){
        winStats.textContent = moveCount + " moves";
        winOverlay.classList.add("show");
        launchConfetti();
      }, 250);
    }
  }

  function cardEl(card, extraClass){
    var div = document.createElement("div");
    div.className = "card " + (card.faceUp ? "up "+SUIT_COLOR[card.suit] : "down") + (extraClass?(" "+extraClass):"");
    div.dataset.cardId = card.suit + card.rank;
    if (card.faceUp){
      var rankText = rankLabel(card.rank);
      var rankHtml = card.rank === 10 ? '<span class="rank-ten">'+rankText+'</span>' : rankText;
      div.innerHTML =
        '<div class="rank">'+rankHtml+'<span class="suit-mini">'+suitSvg(card.suit)+'</span></div>'+
        '<div class="pip">'+suitSvg(card.suit)+'</div>';
    }
    return div;
  }

  // Snapshot every on-board card's position + face state right before a
  // re-render, then diff against the freshly rebuilt DOM afterward: a
  // card whose position changed gets a FLIP transform animation (starts
  // offset by the delta, transitions to zero); a card that stayed put
  // but flipped face-down->face-up gets a rotateY reveal animation
  // instead. Cards are matched by suit+rank, which is a stable identity
  // since a deck has exactly one of each.
  function captureCardSnapshots(){
    var map = {};
    document.querySelectorAll("[data-card-id]").forEach(function(el){
      map[el.dataset.cardId] = {
        rect: el.getBoundingClientRect(),
        faceUp: el.classList.contains("up")
      };
    });
    return map;
  }

  function flipRevealEl(el){
    if (!el) return;
    el.classList.remove("flip-reveal");
    void el.offsetWidth;
    el.classList.add("flip-reveal");
    el.addEventListener("animationend", function handler(){
      el.classList.remove("flip-reveal");
      el.removeEventListener("animationend", handler);
    }, {once:true});
  }

  function applyCardTransitions(prevSnapshots){
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll("[data-card-id]").forEach(function(el){
      var prev = prevSnapshots[el.dataset.cardId];
      if (!prev) return;
      var newRect = el.getBoundingClientRect();
      var dx = prev.rect.left - newRect.left;
      var dy = prev.rect.top - newRect.top;
      var moved = Math.abs(dx) > 1 || Math.abs(dy) > 1;
      var isNowUp = el.classList.contains("up");
      if (moved){
        var baseTransform = el.style.transform || "";
        // elevate above every other card while animating across the
        // board, so it doesn't visually pass behind later-painted
        // columns/piles — then restore whatever z-index it had before
        // (the waste fan sets its own per-card z-index, which a blind
        // reset would otherwise clobber)
        var baseZIndex = el.style.zIndex || "";
        el.style.zIndex = "50";
        el.style.transition = "none";
        el.style.transform = "translate("+dx+"px,"+dy+"px) " + baseTransform;
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.style.transition = "transform .22s ease";
            el.style.transform = baseTransform;
            el.addEventListener("transitionend", function handler(){
              el.style.transition = "";
              el.style.zIndex = baseZIndex;
              el.removeEventListener("transitionend", handler);
            });
          });
        });
      } else if (!prev.faceUp && isNowUp){
        flipRevealEl(el);
      }
    });
  }

  function render(){
    var prevSnapshots = captureCardSnapshots();
    renderBoard();
    applyCardTransitions(prevSnapshots);
  }

  function renderBoard(){
    app.className = handMode;
    drawSwitch.textContent = drawCount + "×";
    // visibility (not display) keeps the row's height reserved so the
    // controls/tableau below it never shift when undo appears/disappears
    var noHistory = history.length === 0;
    undoBtn.style.visibility = noHistory ? "hidden" : "";
    undoBtn.style.pointerEvents = noHistory ? "none" : "";

    // foundations
    foundationsEl.innerHTML = "";
    SUITS.forEach(function(suit){
      var slot = document.createElement("div");
      slot.className = "foundation";
      slot.dataset.suit = suit;
      var pile = state.foundations[suit];
      if (pile.length){
        var top = pile[pile.length-1];
        var topEl = cardEl(top);
        topEl.addEventListener("pointerdown", onCardPointerDown("foundation", suit, -1));
        slot.appendChild(topEl);
      } else {
        slot.innerHTML = suitSvg(suit, "ghost");
      }
      foundationsEl.appendChild(slot);
    });

    // tableau
    tableauEl.innerHTML = "";
    state.tableau.forEach(function(pile, col){
      var colEl = document.createElement("div");
      colEl.className = "col";
      colEl.dataset.col = col;
      if (!pile.length){
        var drop = document.createElement("div");
        drop.className = "empty-drop";
        colEl.appendChild(drop);
      } else {
        var prevFaceUp = null;
        pile.forEach(function(card, idx){
          var el = cardEl(card, "");
          if (prevFaceUp !== null){
            // face-up-under-face-up stays width-relative (needs to keep
            // showing the rank corner at any card size); face-down-under-
            // face-down uses a fixed 8px reveal regardless of card size
            el.style.marginTop = prevFaceUp ? "-102%" : "calc((var(--card-w) * -1.4) + 8px)";
          }
          prevFaceUp = card.faceUp;
          el.addEventListener("pointerdown", onCardPointerDown("tableau", col, idx));
          colEl.appendChild(el);
        });
      }
      tableauEl.appendChild(colEl);
    });

    // waste — in 1-draw mode only the single playable card ever exists,
    // so there's nothing to fan. In 3-draw mode, fan up to 3 cards with
    // enough offset to read each one's full rank+suit corner (not just
    // a sliver), extending away from the stock pile so it never covers it.
    wasteSlot.innerHTML = "";
    if (state.waste.length){
      var peekCount = drawCount === 3 ? Math.min(3, state.waste.length) : 1;
      var peekStart = state.waste.length - peekCount;
      var fanDir = handMode === "right" ? -1 : 1;
      for (var wi=peekStart; wi<state.waste.length; wi++){
        var depth = state.waste.length - 1 - wi;
        var isTop = depth === 0;
        var wEl = cardEl(state.waste[wi], "");
        var fanFraction = (fanDir * depth * 0.56).toFixed(2);
        wEl.style.transform = "translate(calc(var(--card-w) * " + fanFraction + "), 0)";
        wEl.style.zIndex = String(10 - depth);
        if (isTop){
          wEl.addEventListener("pointerdown", onCardPointerDown("waste", -1, state.waste.length-1));
        } else {
          wEl.style.pointerEvents = "none";
        }
        wasteSlot.appendChild(wEl);
      }
    } else {
      var wDrop = document.createElement("div");
      wDrop.className = "empty-drop";
      wasteSlot.appendChild(wDrop);
    }

    // stock
    if (state.stock.length){
      stockBtn.className = "stock-btn";
      stockBtn.innerHTML = "";
    } else {
      stockBtn.className = "stock-btn empty";
      stockBtn.innerHTML = ICON_NEWGAME;
    }
  }

  stockBtn.addEventListener("click", drawCard);
  undoBtn.addEventListener("click", undo);
  newGameBtn.addEventListener("click", function(){
    if (confirm("Start a new game? Current progress will be lost.")) newGame();
  });
  handSwitch.addEventListener("click", function(){
    handMode = handMode === "right" ? "left" : "right";
    render();
  });
  drawSwitch.addEventListener("click", function(){
    drawCount = drawCount === 1 ? 3 : 1;
    render();
  });
  playAgainBtn.addEventListener("click", function(){
    winOverlay.classList.remove("show");
    newGame();
  });
  wordmark.addEventListener("click", function(){
    applyPalette(randomPalette());
  });
  wordmark.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" || ev.key === " "){
      ev.preventDefault();
      applyPalette(randomPalette());
    }
  });

  function launchConfetti(){
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canvas = document.getElementById("confetti");
    if (reduce){ canvas.style.display="none"; return; }
    canvas.style.display = "block";
    var ctx = canvas.getContext("2d");
    var W = canvas.width = window.innerWidth;
    var H = canvas.height = window.innerHeight;
    var rootStyle = getComputedStyle(document.documentElement);
    var colors = ["--brass-500","--brick-600","--paper-100","--felt-600"].map(function(v){
      return rootStyle.getPropertyValue(v).trim();
    });
    var pieces = [];
    for (var i=0;i<90;i++){
      pieces.push({
        x: Math.random()*W,
        y: -20 - Math.random()*H*0.5,
        w: 5+Math.random()*5,
        h: 8+Math.random()*6,
        color: colors[i%colors.length],
        vy: 2+Math.random()*3,
        vx: -1.5+Math.random()*3,
        rot: Math.random()*Math.PI,
        vr: -0.15+Math.random()*0.3
      });
    }
    var start = Date.now();
    function frame(){
      var elapsed = Date.now()-start;
      ctx.clearRect(0,0,W,H);
      pieces.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      });
      if (elapsed < 3200){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,W,H);
        canvas.style.display = "none";
      }
    }
    requestAnimationFrame(frame);
  }

  newGameBtn.innerHTML = ICON_NEWGAME+"<span>New Game</span>";
  undoBtn.innerHTML = ICON_UNDO+"<span>Undo</span>";
  handSwitch.innerHTML = ICON_HAND;

  // Some mobile browsers leave vh/dvh stuck at a stale value after a
  // rotate-then-rotate-back cycle instead of recomputing against the
  // restored viewport. Track the real height in JS as a fallback the
  // layout can lean on — resize covers most cases; orientationchange
  // gets an extra delayed re-check since the viewport doesn't always
  // finish settling by the time that event fires.
  function setAppHeight(){
    document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", function(){
    setAppHeight();
    setTimeout(setAppHeight, 120);
    setTimeout(setAppHeight, 400);
  });

  applyPalette(randomPalette());
  newGame();
})();
</script>
</body>
</html>
